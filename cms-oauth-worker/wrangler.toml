name = "por-dentro-cms-oauth"
main = "worker.js"
compatibility_date = "2024-01-01"

# GITHUB_CLIENT_ID e GITHUB_CLIENT_SECRET são configurados como Secrets
# (painel do Cloudflare ou `wrangler secret put`), não aqui — ver README.md.

# KV usada pelas rotas /api/reviews (avaliações de produto).
[[kv_namespaces]]
binding = "REVIEWS_KV"
id = "20fde19dced446d789215941dda6d813"

# KV usada pelo texto pago dos artigos premium (paywall).
[[kv_namespaces]]
binding = "PREMIUM_KV"
id = "e7f95addec604260b77ff53fb2966550"

# D1 usada pela rota /api/events (feedback dos artigos, interações do bot,
# blocos interativos) e por /api/likes/summary ("Mais curtidos").
[[d1_databases]]
binding = "EVENTS_DB"
database_name = "por-dentro-events"
database_id = "78650fec-7eb1-4f0c-92a8-ca8f8c1ee89b"
