<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Por Dentro — Painel de conteúdo</title>
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/favicon-16x16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>
<!-- Decap CMS: painel onde dá pra editar produtos, banners e posts do blog
     sem mexer em código. Configuração em ./config.yml — ver README.md
     ("Configurar o /admin") para o passo a passo de autenticação com o GitHub. -->
<script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
<!-- Os arquivos do painel são carregados com um número de versão no endereço.
     Sem isso, o navegador guarda cada .js por 4 horas (regra do GitHub Pages) e,
     depois de uma mudança, mistura arquivo novo com arquivo velho: a tela antiga
     continua aparecendo, ou um arquivo novo não acha o outro e o quadro some.

     AO MUDAR QUALQUER ARQUIVO DE /admin/ OU O cover.js, TROQUE O NÚMERO ABAIXO.
     (Se alguém esquecer, o dia entra na versão e o atraso é de no máximo 1 dia.)

     A ordem importa:
     - cover.js: capa por palavra-chave, usada pelo quadro de artigos
     - conferencia.js: trechos a conferir e as fontes deles; antes do editor e do quadro
     - article-composer.js: editor do artigo (precisa dos globais CMS/createClass/h do Decap)
     - Sortable + studio-kit.js: base dos estúdios (arrastar e soltar, prévia do site real)
     - estúdios e quadro de artigos, em cima das mesmas coleções
     - home.js: início do painel ("Admin"), com menu, pendências e "Ir para…" (⌘K) -->
<script>
(function () {
  var VERSAO = "2026-10-10.2";
  var v = VERSAO + "-" + Math.floor(Date.now() / 86400000);
  [
    "/assets/js/cover.js",
    "./widgets/conferencia.js",
    "./widgets/article-composer.js",
    "./vendor/Sortable.min.js",
    "./widgets/studio-kit.js",
    "./widgets/product-studio.js",
    "./widgets/links-studio.js",
    "./widgets/menu-studio.js",
    "./widgets/posts-board.js",
    "./widgets/article-ads-studio.js",
    "./widgets/banners-studio.js",
    "./home.js"
  ].forEach(function (src) { document.write('<script src="' + src + "?v=" + v + '"><\/script>'); });
})();
</script>
</body>
</html>
