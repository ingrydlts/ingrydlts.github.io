backend:
  name: github
  repo: ingrydlts/ingrydlts.github.io
  branch: main
  base_url: https://por-dentro-cms-oauth.ingrydigitalmanagement.workers.dev
  auth_endpoint: auth

# Imagens enviadas pelo painel caem aqui e ficam disponíveis em /images/uploads/...
media_folder: "images/uploads"
public_folder: "/images/uploads"

locale: "pt"

collections:
  - name: nav_visibility
    label: "Cabeçalho e rodapé (menu do site)"
    files:
      - name: nav_visibility
        label: "Ativar/desativar o menu por página"
        file: content/nav-visibility.json
        fields:
          - label: "Ligar/desligar tudo de uma vez, por categoria"
            name: categories
            widget: object
            hint: "Cada interruptor liga ou desliga o cabeçalho/rodapé de TODAS as páginas dessa categoria de uma vez — é o \"selecionar tudo / desmarcar tudo\". Só vale pra páginas que estiverem em \"Seguir categoria\" lá embaixo, em \"Cada página\"."
            fields:
              - label: Home
                name: home
                widget: object
                fields: &category_toggle
                  - { label: "Cabeçalho (menu no topo)", name: header, widget: boolean, default: true }
                  - { label: "Rodapé (menu de navegação no rodapé)", name: footer, widget: boolean, default: true }
                  - { label: "Logo redireciona pra Home", name: logo, widget: boolean, default: true }
              - label: "Produtos (digitais, de estudo, de compras)"
                name: produtos
                widget: object
                fields: *category_toggle
              - label: Blog
                name: blog
                widget: object
                fields: *category_toggle
              - label: "Institucional (Sobre, CGV, Confidentialité, Mentions légales)"
                name: institucional
                widget: object
                fields: *category_toggle
          - label: "Cada página (só preencha se essa página precisar ser diferente da categoria dela)"
            name: pages
            widget: object
            hint: "Deixe em \"Seguir categoria\" na grande maioria das páginas — assim elas obedecem o interruptor da categoria, lá em cima. Só mude uma página específica pra \"Ativado\" ou \"Desativado\" quando ela for a exceção — por exemplo, o Blog inteiro ligado mas uma página de artigo isolada funcionando como landing antes do lançamento."
            fields:
              - label: Home
                name: home
                widget: object
                fields: &page_toggle
                  - { label: Cabeçalho, name: header, widget: select, default: "categoria", options: [{ label: "Seguir categoria", value: "categoria" }, { label: Ativado, value: "ativado" }, { label: Desativado, value: "desativado" }] }
                  - { label: Rodapé, name: footer, widget: select, default: "categoria", options: [{ label: "Seguir categoria", value: "categoria" }, { label: Ativado, value: "ativado" }, { label: Desativado, value: "desativado" }] }
                  - { label: "Logo redireciona pra Home", name: logo, widget: select, default: "categoria", options: [{ label: "Seguir categoria", value: "categoria" }, { label: Ativado, value: "ativado" }, { label: Desativado, value: "desativado" }] }
              - label: "Produtos digitais"
                name: produtos-digitais
                widget: object
                fields: *page_toggle
              - label: "Produtos digitais — página de um produto"
                name: produtos-digitais-produto
                widget: object
                fields: *page_toggle
              - label: "Produtos de estudo"
                name: produtos-de-estudo
                widget: object
                fields: *page_toggle
              - label: "Produtos de compras"
                name: produtos-de-compras
                widget: object
                fields: *page_toggle
              - label: Sobre
                name: sobre
                widget: object
                fields: *page_toggle
              - label: CGV
                name: cgv
                widget: object
                fields: *page_toggle
              - label: Confidentialité
                name: confidentialite
                widget: object
                fields: *page_toggle
              - label: "Mentions légales"
                name: mentions-legales
                widget: object
                fields: *page_toggle
              - label: "Blog — lista de artigos"
                name: artigos
                widget: object
                fields: *page_toggle
              - label: "Blog — modelo de artigo (usado por artigos sem página própria)"
                name: artigos-post-template
                widget: object
                fields: *page_toggle
              - label: "Assinatura confirmada"
                name: artigos-assinatura-confirmada
                widget: object
                fields: *page_toggle

  - name: produtos_digitais
    label: "Produtos digitais"
    files:
      - name: produtos_digitais
        label: "Lista de produtos digitais"
        file: content/produtos-digitais.json
        fields:
          - label: Produtos
            name: items
            widget: list
            summary: "{{title}} — {{price}} €"
            fields:
              - { label: "Slug (parte da URL, sem espaço/acento)", name: slug, widget: string }
              - { label: Título, name: title, widget: string }
              - { label: "Categoria curta (ex. Template Excel)", name: kicker, widget: string }
              - { label: "Resumo (aparece no card)", name: summary, widget: string }
              - { label: "Descrição (aparece na página do produto)", name: description, widget: text }
              - { label: "Imagem de capa (aparece no card da lista)", name: image, widget: image, required: false, hint: "Tamanho ideal: 1200×900px (proporção 4:3), foto na horizontal." }
              - label: "Galeria da página do produto (fotos e vídeos)"
                name: gallery
                widget: list
                required: false
                min: 0
                max: 6
                hint: "Até 6 itens (fotos e/ou vídeos). Se deixar vazio, a página do produto usa só a imagem de capa acima."
                summary: "{{fields.type}} — {{fields.caption}}"
                fields:
                  - { label: Tipo, name: type, widget: select, options: ["Foto", "Vídeo"], default: "Foto" }
                  - { label: "Foto (se tipo = Foto)", name: image, widget: image, required: false, hint: "Tamanho ideal: 1200×900px (proporção 4:3), foto na horizontal." }
                  - { label: "Link do vídeo (se tipo = Vídeo)", name: videoUrl, widget: string, required: false, hint: "URL do YouTube, Vimeo ou de um arquivo .mp4 direto." }
                  - { label: "Legenda (opcional)", name: caption, widget: string, required: false }
              - { label: "Preço atual (€)", name: price, widget: number, value_type: float }
              - { label: "Preço antigo — deixe em branco se não houver desconto", name: priceOld, widget: number, value_type: float, required: false }
              - { label: "Selo de lançamento (opcional)", name: launchNote, widget: string, required: false }
              - { label: "Dias de garantia", name: guaranteeDays, widget: number, required: false, default: 14 }
              - label: "O que inclui (lista de recursos)"
                name: features
                widget: list
                required: false
                field: { label: Item, name: item, widget: string }
              - label: "Perguntas frequentes"
                name: faq
                widget: list
                required: false
                fields:
                  - { label: Pergunta, name: q, widget: string }
                  - { label: Resposta, name: a, widget: text }
              - { label: "Link de pagamento do Stripe (Payment Link)", name: stripeLink, widget: string, required: false, hint: "Cole aqui o link gerado no painel do Stripe para este produto." }
              - label: "Combo com outros produtos (bundle)"
                name: bundleWith
                widget: list
                required: false
                hint: "Cole o \"slug\" de outro produto digital (o campo Slug dele, lá em cima) pra formar um combo. O desconto do combo é calculado sozinho pela página: 10% com 2 produtos, 15% com 3, 20% com 4 ou mais."
                field: { label: "Slug do outro produto", name: slug, widget: string }

  - name: produtos_estudo
    label: "Produtos de estudo (afiliados)"
    files:
      - name: produtos_estudo
        label: "Lista de indicações de estudo"
        file: content/produtos-estudo.json
        fields:
          - label: Itens
            name: items
            widget: list
            summary: "{{title}}"
            fields:
              - { label: Título, name: title, widget: string }
              - { label: Descrição curta, name: desc, widget: string }
              - { label: Imagem, name: image, widget: image, required: false, hint: "Tamanho ideal: 1200×900px (proporção 4:3), foto na horizontal. Aparece no card da lista." }
              - { label: "Link de afiliado", name: affiliateUrl, widget: string, required: false }

  - name: produtos_compras
    label: "Produtos de compras (afiliados)"
    files:
      - name: produtos_compras
        label: "Lista de indicações de compras"
        file: content/produtos-compras.json
        fields:
          - label: Itens
            name: items
            widget: list
            summary: "{{title}}"
            fields:
              - { label: Título, name: title, widget: string }
              - { label: Descrição curta, name: desc, widget: string }
              - { label: Imagem, name: image, widget: image, required: false, hint: "Tamanho ideal: 1200×900px (proporção 4:3), foto na horizontal. Aparece no card da lista." }
              - { label: "Link de afiliado", name: affiliateUrl, widget: string, required: false }

  - name: posts
    label: "Blog — artigos"
    files:
      - name: posts
        label: "Lista de artigos"
        file: content/posts.json
        fields:
          - label: Artigos
            name: items
            widget: list
            summary: "{{title}} ({{category}})"
            fields:
              - { label: "Slug (parte da URL, sem espaço/acento)", name: slug, widget: string }
              - { label: Título, name: title, widget: string }
              - { label: "Resumo (aparece no card)", name: excerpt, widget: string }
              - { label: "Categoria (usada nos filtros)", name: category, widget: string }
              - { label: "Foto de capa", name: image, widget: image, required: false, hint: "Tamanho ideal: 1600×900px (proporção 16:9), foto na horizontal e bem ampla. A mesma foto aparece cortada no card do blog (mais quadrada) e larga no topo do artigo — por isso precisa ser bem panorâmica." }
              - { label: "Data de publicação", name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
              - { label: "Última atualização", name: updatedDate, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, required: false, hint: "Aparece no topo do artigo como \"Atualizado em\". Mude essa data sempre que revisar ou corrigir o conteúdo — é o que mostra pra leitora que a informação ainda é confiável." }
              - { label: "Tempo de leitura (min)", name: readMinutes, widget: number, required: false }
              - { label: "Corpo do artigo", name: body, widget: markdown, hint: "Use ## para subtítulo, - para lista, **negrito**, [texto](link). Se o artigo for premium, este texto é a prévia gratuita — a continuação paga é escrita à parte, em /admin/premium/." }
              - { label: "Artigo premium (assinatura)", name: premium, widget: boolean, default: false, required: false, hint: "Marque para exigir assinatura pra ler o conteúdo completo. O texto pago não fica aqui — escreva-o no painel /admin/premium/ depois de salvar este artigo." }
              - { label: "URL fixa (não editar manualmente)", name: url, widget: string, required: false, hint: "Usado internamente para os artigos que têm página própria. Deixe como está — não apague nem edite este campo." }
              - label: "Cabeçalho desta página"
                name: headerMode
                widget: select
                default: "categoria"
                required: false
                options:
                  - { label: "Seguir a categoria Blog (definida em \"Cabeçalho e rodapé\")", value: "categoria" }
                  - { label: Ativado, value: "ativado" }
                  - { label: "Desativado — só a logo, sem menu (landing de pré-lançamento)", value: "desativado" }
                hint: "Use \"Desativado\" pra transformar este artigo numa landing page isolada, sem links pra partes do site que ainda não lançaram. Depois do lançamento, volte pra \"Seguir a categoria Blog\"."
              - label: "Rodapé desta página"
                name: footerMode
                widget: select
                default: "categoria"
                required: false
                options:
                  - { label: "Seguir a categoria Blog (definida em \"Cabeçalho e rodapé\")", value: "categoria" }
                  - { label: Ativado, value: "ativado" }
                  - { label: "Desativado — esconde o menu de navegação do rodapé", value: "desativado" }
                hint: "Mesma lógica do cabeçalho, mas pro bloco \"Navegação\" do rodapé (os links pra Produtos, Blog, Sobre etc. lá embaixo da página)."
              - label: "Logo redireciona pra Home, nesta página"
                name: logoMode
                widget: select
                default: "categoria"
                required: false
                options:
                  - { label: "Seguir a categoria Blog (definida em \"Cabeçalho e rodapé\")", value: "categoria" }
                  - { label: Ativado, value: "ativado" }
                  - { label: "Desativado — a logo aparece, mas não é um link", value: "desativado" }
                hint: "Desative junto com o Cabeçalho quando este artigo for uma landing isolada — assim nem a logo leva de volta pro site."

  - name: header_config
    label: "Cabeçalho do site"
    files:
      - name: header_config
        label: "Links do menu (cabeçalho)"
        file: content/header-config.json
        fields:
          - label: "Menu principal"
            name: links
            widget: object
            hint: "Controla os links do cabeçalho em TODAS as páginas do site. Desmarque \"Mostrar\" pra esconder uma seção que ainda não foi lançada — sem precisar editar código. Pra uma página de artigo específica virar uma landing sem menu nenhum, use o campo \"Cabeçalho desta página\" lá no artigo, em Blog — artigos."
            fields:
              - label: "Produtos digitais"
                name: produtos-digitais
                widget: object
                fields:
                  - { label: Mostrar, name: enabled, widget: boolean, default: true }
                  - { label: "Texto do link", name: label, widget: string, default: "Produtos digitais" }
                  - { label: "Link (URL)", name: href, widget: string, default: "/produtos-digitais/" }
              - label: "Produtos de estudo"
                name: produtos-de-estudo
                widget: object
                fields:
                  - { label: Mostrar, name: enabled, widget: boolean, default: true }
                  - { label: "Texto do link", name: label, widget: string, default: "Produtos de estudo" }
                  - { label: "Link (URL)", name: href, widget: string, default: "/produtos-de-estudo/" }
              - label: "Produtos de compras"
                name: produtos-de-compras
                widget: object
                fields:
                  - { label: Mostrar, name: enabled, widget: boolean, default: true }
                  - { label: "Texto do link", name: label, widget: string, default: "Produtos de compras" }
                  - { label: "Link (URL)", name: href, widget: string, default: "/produtos-de-compras/" }
              - label: "Blog"
                name: blog
                widget: object
                fields:
                  - { label: Mostrar, name: enabled, widget: boolean, default: true }
                  - { label: "Texto do link", name: label, widget: string, default: "Blog" }
                  - { label: "Link (URL)", name: href, widget: string, default: "/artigos/" }
              - label: "Sobre"
                name: sobre
                widget: object
                fields:
                  - { label: Mostrar, name: enabled, widget: boolean, default: true }
                  - { label: "Texto do link", name: label, widget: string, default: "Sobre" }
                  - { label: "Link (URL)", name: href, widget: string, default: "/sobre/" }

  - name: premium_config
    label: "Assinatura de artigos premium"
    files:
      - name: premium_config
        label: "Configuração da assinatura"
        file: content/premium-config.json
        fields:
          - { label: "Link de pagamento do Stripe (modo assinatura)", name: stripePaymentLink, widget: string, required: false, hint: "Cole aqui o Payment Link criado no Stripe em modo assinatura — não o de compra avulsa." }
          - { label: "Texto do preço da assinatura (aparece no botão)", name: priceLabel, widget: string, default: "4,99€/mês" }
          - { label: "Link de pagamento do Stripe (compra avulsa, um artigo só)", name: articlePaymentLink, widget: string, required: false, hint: "Cole aqui o Payment Link criado no Stripe em modo pagamento único (não assinatura). É o mesmo link pra qualquer artigo — o site identifica sozinho qual artigo foi comprado." }
          - { label: "Texto do preço da compra avulsa (aparece no botão)", name: articlePriceLabel, widget: string, default: "10€ (só este artigo)" }
          - { label: "Título do bloco de assinatura", name: paywallTitle, widget: string, default: "Continue lendo com a assinatura" }
          - { label: "Texto do bloco de assinatura", name: paywallBody, widget: text, default: "Assine para ter acesso completo a este e a outros artigos premium." }
          - { label: "Link do portal de gerenciamento (Stripe Customer Portal)", name: customerPortalUrl, widget: string, required: false, hint: "Link fixo para a assinante cancelar ou gerenciar a assinatura sozinha. Gere em Stripe → Settings → Billing → Customer portal." }

  - name: banners
    label: "Banners e destaques"
    files:
      - name: banners
        label: "Banners do site"
        file: content/banners.json
        fields:
          - label: Home
            name: home
            widget: object
            fields:
              - { label: "Foto do hero", name: heroImage, widget: image, required: false, hint: "Tamanho ideal: 1200×960px (proporção 5:4), foto na horizontal. É a foto grande de destaque no topo da Home." }
              - { label: "Texto alternativo da foto", name: heroImageAlt, widget: string, required: false }
          - label: "Banners vitrine → blog (um por categoria)"
            name: categoryBanners
            widget: object
            fields:
              - label: "Produtos digitais"
                name: produtos-digitais
                widget: object
                fields:
                  - { label: Selo, name: kicker, widget: string }
                  - { label: Título, name: title, widget: string }
                  - { label: Foto, name: image, widget: image, required: false, hint: "Tamanho ideal: 1200×675px (proporção 16:9), foto na horizontal e ampla." }
                  - { label: "Cor (hex)", name: color, widget: string }
                  - { label: "Texto do botão", name: ctaText, widget: string }
                  - { label: "Slug do artigo pra onde o botão leva", name: postSlug, widget: string }
              - label: "Produtos de estudo"
                name: produtos-de-estudo
                widget: object
                fields:
                  - { label: Selo, name: kicker, widget: string }
                  - { label: Título, name: title, widget: string }
                  - { label: Foto, name: image, widget: image, required: false, hint: "Tamanho ideal: 1200×675px (proporção 16:9), foto na horizontal e ampla." }
                  - { label: "Cor (hex)", name: color, widget: string }
                  - { label: "Texto do botão", name: ctaText, widget: string }
                  - { label: "Slug do artigo pra onde o botão leva", name: postSlug, widget: string }
              - label: "Produtos de compras"
                name: produtos-de-compras
                widget: object
                fields:
                  - { label: Selo, name: kicker, widget: string }
                  - { label: Título, name: title, widget: string }
                  - { label: Foto, name: image, widget: image, required: false, hint: "Tamanho ideal: 1200×675px (proporção 16:9), foto na horizontal e ampla." }
                  - { label: "Cor (hex)", name: color, widget: string }
                  - { label: "Texto do botão", name: ctaText, widget: string }
                  - { label: "Slug do artigo pra onde o botão leva", name: postSlug, widget: string }
          - label: "Banner lateral do blog (promove um produto)"
            name: blogSidebar
            widget: object
            fields:
              - { label: Selo, name: kicker, widget: string }
              - { label: Título, name: title, widget: string }
              - { label: Texto, name: body, widget: text }
              - { label: Foto, name: image, widget: image, required: false, hint: "Tamanho ideal: 1200×900px (proporção 4:3), foto na horizontal." }
              - { label: "Cor (hex)", name: color, widget: string }
              - { label: "Texto do botão", name: ctaText, widget: string }
              - { label: "Link do botão", name: ctaHref, widget: string }
