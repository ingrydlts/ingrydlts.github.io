backend:
  name: github
  repo: ingrydlts/ingrydlts.github.io
  branch: main
  base_url: https://por-dentro-cms-oauth.ingrydigitalmanagement.workers.dev
  auth_endpoint: auth

# Imagens enviadas pelo painel caem aqui e ficam disponíveis em /images/uploads/...
media_folder: "images/uploads"
public_folder: "/images/uploads"

locale: "pt"

collections:
  - name: nav_visibility
    label: "Cabeçalho e rodapé (menu do site)"
    files:
      - name: nav_visibility
        label: "Ativar/desativar o menu por página"
        file: content/nav-visibility.json
        fields:
          - label: "Ligar/desligar tudo de uma vez, por categoria"
            name: categories
            widget: object
            hint: "Cada interruptor liga ou desliga o cabeçalho/rodapé de TODAS as páginas dessa categoria de uma vez — é o \"selecionar tudo / desmarcar tudo\". Só vale pra páginas que estiverem em \"Seguir categoria\" lá embaixo, em \"Cada página\"."
            fields:
              - label: Home
                name: home
                widget: object
                fields: &category_toggle
                  - { label: "Cabeçalho (menu no topo)", name: header, widget: boolean, default: true }
                  - { label: "Rodapé (menu de navegação no rodapé)", name: footer, widget: boolean, default: true }
                  - { label: "Logo redireciona pra Home", name: logo, widget: boolean, default: true }
              - label: "Produtos (digitais, de estudo, de compras)"
                name: produtos
                widget: object
                fields: *category_toggle
              - label: Blog
                name: blog
                widget: object
                fields: *category_toggle
              - label: "Institucional (Sobre, CGV, Confidentialité, Mentions légales)"
                name: institucional
                widget: object
                fields: *category_toggle
          - label: "Cada página (só preencha se essa página precisar ser diferente da categoria dela)"
            name: pages
            widget: object
            hint: "Deixe em \"Seguir categoria\" na grande maioria das páginas — assim elas obedecem o interruptor da categoria, lá em cima. Só mude uma página específica pra \"Ativado\" ou \"Desativado\" quando ela for a exceção — por exemplo, o Blog inteiro ligado mas uma página de artigo isolada funcionando como landing antes do lançamento."
            fields:
              - label: Home
                name: home
                widget: object
                fields: &page_toggle
                  - { label: Cabeçalho, name: header, widget: select, default: "categoria", options: [{ label: "Seguir categoria", value: "categoria" }, { label: Ativado, value: "ativado" }, { label: Desativado, value: "desativado" }] }
                  - { label: Rodapé, name: footer, widget: select, default: "categoria", options: [{ label: "Seguir categoria", value: "categoria" }, { label: Ativado, value: "ativado" }, { label: Desativado, value: "desativado" }] }
                  - { label: "Logo redireciona pra Home", name: logo, widget: select, default: "categoria", options: [{ label: "Seguir categoria", value: "categoria" }, { label: Ativado, value: "ativado" }, { label: Desativado, value: "desativado" }] }
              - label: "Produtos digitais"
                name: produtos-digitais
                widget: object
                fields: *page_toggle
              - label: "Produtos digitais — página de um produto"
                name: produtos-digitais-produto
                widget: object
                fields: *page_toggle
              - label: "Produtos de estudo"
                name: produtos-de-estudo
                widget: object
                fields: *page_toggle
              - label: "Produtos de compras"
                name: produtos-de-compras
                widget: object
                fields: *page_toggle
              - label: Sobre
                name: sobre
                widget: object
                fields: *page_toggle
              - label: "Links (bio)"
                name: links
                widget: object
                fields: *page_toggle
              - label: CGV
                name: cgv
                widget: object
                fields: *page_toggle
              - label: Confidentialité
                name: confidentialite
                widget: object
                fields: *page_toggle
              - label: "Mentions légales"
                name: mentions-legales
                widget: object
                fields: *page_toggle
              - label: "Blog — lista de artigos"
                name: artigos
                widget: object
                fields: *page_toggle
              - label: "Blog — modelo de artigo (usado por artigos sem página própria)"
                name: artigos-post-template
                widget: object
                fields: *page_toggle
              - label: "Assinatura confirmada"
                name: artigos-assinatura-confirmada
                widget: object
                fields: *page_toggle

  - name: links_page
    label: "Página de Links (bio)"
    files:
      - name: links_page
        label: "Conteúdo da /links/"
        file: content/links.json
        fields:
          - label: "Topo (foto, bio, redes)"
            name: hero
            widget: object
            fields:
              - { label: "Handle (@usuário)", name: handle, widget: string }
              - { label: "Título", name: title, widget: string }
              - { label: "Bio", name: bio, widget: text }
              - { label: "Foto", name: avatar, widget: image, required: false, hint: "Tamanho ideal: quadrada (ex. 400×400px) — aparece cortada em círculo." }
              - { label: "Link do Instagram", name: instagramUrl, widget: string }
              - { label: "Link do YouTube", name: youtubeUrl, widget: string }
          - label: "Card do assistente (bot)"
            name: bot
            widget: object
            fields:
              - { label: "Título", name: title, widget: string }
              - { label: "Descrição", name: description, widget: text }
              - { label: "Link (ex. /assistente-de-vistos/)", name: href, widget: string }
          - label: "Seções de links"
            name: sections
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: "Título da seção", name: title, widget: string }
              - label: "Itens"
                name: items
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { label: "Emoji do ícone", name: icon, widget: string }
                  - { label: "Título", name: title, widget: string }
                  - { label: "Descrição", name: description, widget: text }
                  - { label: "Link", name: href, widget: string, hint: "Link interno (ex. /artigos/post/?slug=...) ou externo (https://...)." }
                  - { label: "Id de rastreamento (sem espaço/acento)", name: trackId, widget: string, hint: "Usado só pra identificar o clique em /admin/dashboard — não aparece pra leitora." }
                  - { label: "Link externo (abre em nova aba)", name: external, widget: boolean, default: false }
                  - { label: "Preço (opcional, ex. 25€)", name: price, widget: string, required: false }

  - name: produtos_digitais
    label: "Produtos digitais"
    files:
      - name: produtos_digitais
        label: "Lista de produtos digitais"
        file: content/produtos-digitais.json
        fields:
          - label: Produtos
            name: items
            widget: list
            summary: "{{title}} — {{price}} €"
            fields:
              - { label: "Slug (parte da URL, sem espaço/acento)", name: slug, widget: string }
              - { label: Título, name: title, widget: string }
              - { label: "Categoria curta (ex. Template Excel)", name: kicker, widget: string }
              - { label: "Resumo (aparece no card)", name: summary, widget: string }
              - { label: "Descrição (aparece na página do produto)", name: description, widget: text }
              - { label: "Imagem de capa (aparece no card da lista)", name: image, widget: image, required: false, hint: "Tamanho ideal: 1200×900px (proporção 4:3), foto na horizontal." }
              - label: "Galeria da página do produto (fotos e vídeos)"
                name: gallery
                widget: list
                required: false
                min: 0
                max: 6
                hint: "Até 6 itens (fotos e/ou vídeos). Se deixar vazio, a página do produto usa só a imagem de capa acima."
                summary: "{{fields.type}} — {{fields.caption}}"
                fields:
                  - { label: Tipo, name: type, widget: select, options: ["Foto", "Vídeo"], default: "Foto" }
                  - { label: "Foto (se tipo = Foto)", name: image, widget: image, required: false, hint: "Tamanho ideal: 1200×900px (proporção 4:3), foto na horizontal." }
                  - { label: "Link do vídeo (se tipo = Vídeo)", name: videoUrl, widget: string, required: false, hint: "URL do YouTube, Vimeo ou de um arquivo .mp4 direto." }
                  - { label: "Legenda (opcional)", name: caption, widget: string, required: false }
              - { label: "Preço atual (€)", name: price, widget: number, value_type: float }
              - { label: "Preço antigo — deixe em branco se não houver desconto", name: priceOld, widget: number, value_type: float, required: false }
              - { label: "Selo de lançamento (opcional)", name: launchNote, widget: string, required: false }
              - { label: "Dias de garantia", name: guaranteeDays, widget: number, required: false, default: 14 }
              - label: "O que inclui (lista de recursos)"
                name: features
                widget: list
                required: false
                field: { label: Item, name: item, widget: string }
              - label: "Perguntas frequentes"
                name: faq
                widget: list
                required: false
                fields:
                  - { label: Pergunta, name: q, widget: string }
                  - { label: Resposta, name: a, widget: text }
              - { label: "Link de pagamento do Stripe (Payment Link)", name: stripeLink, widget: string, required: false, hint: "Cole aqui o link gerado no painel do Stripe para este produto." }
              - label: "Combo com outros produtos (bundle)"
                name: bundleWith
                widget: list
                required: false
                hint: "Cole o \"slug\" de outro produto digital (o campo Slug dele, lá em cima) pra formar um combo. O desconto do combo é calculado sozinho pela página: 10% com 2 produtos, 15% com 3, 20% com 4 ou mais."
                field: { label: "Slug do outro produto", name: slug, widget: string }

  - name: produtos_estudo
    label: "Produtos de estudo (afiliados)"
    files:
      - name: produtos_estudo
        label: "Lista de indicações de estudo"
        file: content/produtos-estudo.json
        fields:
          - label: Itens
            name: items
            widget: list
            summary: "{{title}}"
            fields:
              - { label: Título, name: title, widget: string }
              - { label: Descrição curta, name: desc, widget: string }
              - { label: Imagem, name: image, widget: image, required: false, hint: "Tamanho ideal: 1200×900px (proporção 4:3), foto na horizontal. Aparece no card da lista." }
              - { label: "Link de afiliado", name: affiliateUrl, widget: string, required: false }

  - name: produtos_compras
    label: "Produtos de compras (afiliados)"
    files:
      - name: produtos_compras
        label: "Lista de indicações de compras"
        file: content/produtos-compras.json
        fields:
          - label: Itens
            name: items
            widget: list
            summary: "{{title}}"
            fields:
              - { label: Título, name: title, widget: string }
              - { label: Descrição curta, name: desc, widget: string }
              - { label: Imagem, name: image, widget: image, required: false, hint: "Tamanho ideal: 1200×900px (proporção 4:3), foto na horizontal. Aparece no card da lista." }
              - { label: "Link de afiliado", name: affiliateUrl, widget: string, required: false }

  - name: posts
    label: "Blog — artigos"
    files:
      - name: posts
        label: "Lista de artigos"
        file: content/posts.json
        fields:
          - label: Artigos
            name: items
            widget: list
            summary: "{{title}} ({{category}})"
            fields:
              - { label: "Slug (parte da URL, sem espaço/acento)", name: slug, widget: string }
              - { label: Título, name: title, widget: string }
              - { label: "Resumo (aparece no card)", name: excerpt, widget: string }
              - { label: "Categoria (usada nos filtros)", name: category, widget: string }
              - { label: "Foto de capa", name: image, widget: image, required: false, hint: "Tamanho ideal: 1600×900px (proporção 16:9), foto na horizontal e bem ampla. A mesma foto aparece cortada no card do blog (mais quadrada) e larga no topo do artigo — por isso precisa ser bem panorâmica." }
              - { label: "Mostrar a foto de capa dentro do artigo", name: showCoverInArticle, widget: boolean, default: true, required: false, hint: "Desligue pra pular a foto grande no topo do artigo (ex. artigos sem uma boa foto, ou que você quer que comecem direto pelo texto). A foto continua aparecendo normalmente no card da lista de artigos — isso só afeta o topo do artigo em si." }
              - { label: "Mostrar \"← Voltar aos artigos\"", name: showBackLink, widget: boolean, default: true, required: false, hint: "Desligue pra tirar o link \"← Voltar aos artigos\" do topo desta página — útil junto com \"Cabeçalho desta página\" desativado, pra transformar o artigo numa landing isolada, sem nenhum caminho de volta pro blog." }
              - { label: "Data de publicação", name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
              - { label: "Última atualização", name: updatedDate, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, required: false, hint: "Aparece no topo do artigo como \"Atualizado em\". Mude essa data sempre que revisar ou corrigir o conteúdo — é o que mostra pra leitora que a informação ainda é confiável." }
              - { label: "Tempo de leitura (min)", name: readMinutes, widget: number, required: false }
              - label: "Corpo do artigo"
                name: body
                widget: article-composer
                hint: "Clique em \"Editar artigo visualmente\" pra ver o artigo em blocos arrastáveis, lado a lado com a pré-visualização de verdade do site. \"Banner de vitrine\" e \"Propaganda\" têm 3 opções: \"Seguir padrão do site\" (obedece o que estiver configurado em \"Vitrine dentro dos artigos\"/\"Anúncios nos artigos\"), \"Ativado aqui\" (força aparecer, arraste o bloco azul pra escolher a posição) e \"Desativado aqui\" (força NÃO aparecer neste artigo, mesmo que o padrão do site esteja ligado — é o jeito de tirar um banner que só está aparecendo por causa do padrão geral). Quando \"Banner de vitrine\" está \"Ativado aqui\", aparece um segundo dropdown pra escolher QUAL produto aparece nesse banner — lista tudo que já está cadastrado em \"Produtos digitais\", \"Produtos de estudo\" e \"Produtos de compras\", puxando título, imagem e link automaticamente. Deixe em \"Genérico\" pra usar o texto configurado em \"Vitrine dentro dos artigos\".\n\n🔒 Ligue \"Bloqueio premium\" pra posicionar estrategicamente onde o artigo vira pago — tudo que ficar DEPOIS desse bloco (arraste-o pra qualquer lugar) é a continuação paga, tudo ANTES continua sendo a prévia grátis normal. Diferente dos outros dois, o conteúdo pago não é salvo automaticamente: use os botões \"Carregar já salvo\" / \"Salvar conteúdo pago\" / \"Remover do servidor\" que aparecem quando o bloqueio está ativo — eles pedem login com GitHub na hora (mesma conta do /admin) e falam direto com o mesmo lugar que o painel /admin/premium/ usa. O texto pago nunca é gravado no corpo do artigo nem vai pro GitHub. Só funciona de verdade com \"Artigo premium (assinatura)\", mais abaixo, também marcado.\n\n⚠️ TODO artigo precisa terminar com [[FAQ]] (sempre em dropdown, nunca solto no texto) e [[FEEDBACK]] — é a regra de captação de audiência do site (ver README.md e GUIA-DE-IMPLEMENTACAO.md). Use [[CHECKLIST]] quando o tema tiver um critério de elegibilidade ou passo a passo verificável, e [[RESOURCES]] pra toda fonte oficial citada — cada pergunta aberta e cada fonte clicada vira dado em /admin/dashboard.\n\nBotão \"Ver texto bruto\", dentro do editor visual, mostra o markdown puro — útil pra colar um bloco rico pronto (cole exatamente assim, cada linha com \"|\" separando as colunas):\n[[STEPS]]\nTítulo do passo | Descrição\n[[/STEPS]]\n\n[[FAQ]] (obrigatório)\nPergunta | Resposta\n[[/FAQ]]\n\n[[RESOURCES]]\nTítulo | Descrição | Texto do link | URL\n[[/RESOURCES]]\n\n[[CHECKLIST]]\nTítulo da checklist\nItem 1\nItem 2\n[[/CHECKLIST]]\n\n[[FEEDBACK]] (obrigatório)\nPergunta (opcional)\n[[/FEEDBACK]]\n\nTambém dá pra usar [[BAND]], [[STATS]], [[CARDS]] e [[LIST]] — mesmo formato de colunas com \"|\"."
              - { label: "Artigo premium (assinatura)", name: premium, widget: boolean, default: false, required: false, hint: "Marque para exigir assinatura pra ler o conteúdo completo. O texto pago não fica aqui — escreva-o no painel /admin/premium/ depois de salvar este artigo." }
              - { label: "URL fixa (não editar manualmente)", name: url, widget: string, required: false, hint: "Usado internamente para os artigos que têm página própria. Deixe como está — não apague nem edite este campo." }
              - label: "Cabeçalho desta página"
                name: headerMode
                widget: select
                default: "categoria"
                required: false
                options:
                  - { label: "Seguir a categoria Blog (definida em \"Cabeçalho e rodapé\")", value: "categoria" }
                  - { label: Ativado, value: "ativado" }
                  - { label: "Desativado — só a logo, sem menu (landing de pré-lançamento)", value: "desativado" }
                hint: "Use \"Desativado\" pra transformar este artigo numa landing page isolada, sem links pra partes do site que ainda não lançaram. Depois do lançamento, volte pra \"Seguir a categoria Blog\"."
              - label: "Rodapé desta página"
                name: footerMode
                widget: select
                default: "categoria"
                required: false
                options:
                  - { label: "Seguir a categoria Blog (definida em \"Cabeçalho e rodapé\")", value: "categoria" }
                  - { label: Ativado, value: "ativado" }
                  - { label: "Desativado — esconde o menu de navegação do rodapé", value: "desativado" }
                hint: "Mesma lógica do cabeçalho, mas pro bloco \"Navegação\" do rodapé (os links pra Produtos, Blog, Sobre etc. lá embaixo da página)."
              - label: "Logo redireciona pra Home, nesta página"
                name: logoMode
                widget: select
                default: "categoria"
                required: false
                options:
                  - { label: "Seguir a categoria Blog (definida em \"Cabeçalho e rodapé\")", value: "categoria" }
                  - { label: Ativado, value: "ativado" }
                  - { label: "Desativado — a logo aparece, mas não é um link", value: "desativado" }
                hint: "Afeta a logo no cabeçalho E no rodapé da página, ao mesmo tempo. Desative junto com o Cabeçalho quando este artigo for uma landing isolada — assim nem a logo leva de volta pro site."

  - name: header_config
    label: "Cabeçalho do site"
    files:
      - name: header_config
        label: "Links do menu (cabeçalho)"
        file: content/header-config.json
        fields:
          - label: "Menu principal"
            name: links
            widget: object
            hint: "Controla os links do cabeçalho em TODAS as páginas do site. Desmarque \"Mostrar\" pra esconder uma seção que ainda não foi lançada — sem precisar editar código. Pra uma página de artigo específica virar uma landing sem menu nenhum, use o campo \"Cabeçalho desta página\" lá no artigo, em Blog — artigos."
            fields:
              - label: "Produtos digitais"
                name: produtos-digitais
                widget: object
                fields:
                  - { label: Mostrar, name: enabled, widget: boolean, default: true }
                  - { label: "Texto do link", name: label, widget: string, default: "Produtos digitais" }
                  - { label: "Link (URL)", name: href, widget: string, default: "/produtos-digitais/" }
              - label: "Produtos de estudo"
                name: produtos-de-estudo
                widget: object
                fields:
                  - { label: Mostrar, name: enabled, widget: boolean, default: true }
                  - { label: "Texto do link", name: label, widget: string, default: "Produtos de estudo" }
                  - { label: "Link (URL)", name: href, widget: string, default: "/produtos-de-estudo/" }
              - label: "Produtos de compras"
                name: produtos-de-compras
                widget: object
                fields:
                  - { label: Mostrar, name: enabled, widget: boolean, default: true }
                  - { label: "Texto do link", name: label, widget: string, default: "Produtos de compras" }
                  - { label: "Link (URL)", name: href, widget: string, default: "/produtos-de-compras/" }
              - label: "Blog"
                name: blog
                widget: object
                fields:
                  - { label: Mostrar, name: enabled, widget: boolean, default: true }
                  - { label: "Texto do link", name: label, widget: string, default: "Blog" }
                  - { label: "Link (URL)", name: href, widget: string, default: "/artigos/" }
              - label: "Sobre"
                name: sobre
                widget: object
                fields:
                  - { label: Mostrar, name: enabled, widget: boolean, default: true }
                  - { label: "Texto do link", name: label, widget: string, default: "Sobre" }
                  - { label: "Link (URL)", name: href, widget: string, default: "/sobre/" }

  - name: premium_config
    label: "Assinatura de artigos premium"
    files:
      - name: premium_config
        label: "Configuração da assinatura"
        file: content/premium-config.json
        fields:
          - { label: "Link de pagamento do Stripe (modo assinatura)", name: stripePaymentLink, widget: string, required: false, hint: "Cole aqui o Payment Link criado no Stripe em modo assinatura — não o de compra avulsa." }
          - { label: "Texto do preço da assinatura (aparece no botão)", name: priceLabel, widget: string, default: "4,99€/mês" }
          - { label: "Link de pagamento do Stripe (compra avulsa, um artigo só)", name: articlePaymentLink, widget: string, required: false, hint: "Cole aqui o Payment Link criado no Stripe em modo pagamento único (não assinatura). É o mesmo link pra qualquer artigo — o site identifica sozinho qual artigo foi comprado." }
          - { label: "Texto do preço da compra avulsa (aparece no botão)", name: articlePriceLabel, widget: string, default: "10€ (só este artigo)" }
          - { label: "Título do bloco de assinatura", name: paywallTitle, widget: string, default: "Continue lendo com a assinatura" }
          - { label: "Texto do bloco de assinatura", name: paywallBody, widget: text, default: "Assine para ter acesso completo a este e a outros artigos premium." }
          - { label: "Link do portal de gerenciamento (Stripe Customer Portal)", name: customerPortalUrl, widget: string, required: false, hint: "Link fixo para a assinante cancelar ou gerenciar a assinatura sozinha. Gere em Stripe → Settings → Billing → Customer portal." }

  - name: analytics_config
    label: "Consentimento e cookies"
    files:
      - name: analytics_config
        label: "Banner de consentimento"
        file: content/analytics-config.json
        fields:
          - { label: "Ligar/desligar toda a medição de audiência", name: trackingEnabled, widget: boolean, default: true, hint: "Desligado = o banner nunca aparece e nada é medido (nem quando o Google Analytics/Clarity forem ativados). É o interruptor de emergência." }
          - { label: "ID de medição do Google Analytics (GA4)", name: ga4MeasurementId, widget: string, required: false, hint: "Formato G-XXXXXXXXXX. Encontre em analytics.google.com → Administrador → Fluxos de dados → seu site → \"ID da métrica\". Deixe em branco pra não carregar o GA4." }
          - { label: "ID do projeto Microsoft Clarity", name: clarityProjectId, widget: string, required: false, hint: "Encontre em clarity.microsoft.com → seu projeto → Settings → Overview → \"Project ID\" (só o código, sem o resto do link). Deixe em branco pra não carregar o Clarity." }
          - label: "Texto do banner"
            name: consentBanner
            widget: object
            fields:
              - { label: Título, name: title, widget: string }
              - { label: "Texto explicativo", name: body, widget: text }
              - { label: "Botão de aceitar", name: acceptLabel, widget: string, default: "Aceitar" }
              - { label: "Botão de recusar", name: declineLabel, widget: string, default: "Recusar" }
              - { label: "Texto do link \"saiba mais\"", name: linkLabel, widget: string, default: "Saiba mais" }
              - { label: "Link do \"saiba mais\"", name: linkHref, widget: string, default: "/confidentialite/" }

  - name: ads_config
    label: "Anúncios nos artigos"
    files:
      - name: ads_config
        label: "Posições e anúncios"
        file: content/ads-config.json
        fields:
          - { label: "Ligar/desligar todos os anúncios", name: enabled, widget: boolean, default: true, hint: "Desligado = nenhum anúncio aparece em lugar nenhum, mesmo que as posições abaixo estejam preenchidas. É o interruptor de emergência — útil pra pausar tudo rápido, sem mexer em código." }
          - label: "Anúncio de rede (ex. Google AdSense)"
            name: network
            widget: object
            hint: "Cole aqui exatamente o código que a rede de anúncios te der."
            fields:
              - { label: "Código do <head> (carrega a rede — aparece 1x por página, só se algum anúncio de rede estiver ativo)", name: headSnippet, widget: text, required: false }
              - { label: "Código do anúncio (o bloco em si, repete em cada posição marcada como \"Anúncio de rede\" abaixo)", name: adSnippet, widget: text, required: false }
          - label: "Banner próprio (promove seus produtos)"
            name: ownBanner
            widget: object
            hint: "Aparece nas posições marcadas como \"Banner próprio\" abaixo — o mesmo banner em todas elas."
            fields:
              - { label: Selo, name: kicker, widget: string, required: false }
              - { label: Título, name: title, widget: string, required: false }
              - { label: Texto, name: body, widget: text, required: false }
              - { label: "Cor (hex)", name: color, widget: string, required: false }
              - { label: "Texto do botão", name: ctaText, widget: string, required: false }
              - { label: "Link do botão", name: ctaHref, widget: string, required: false }
          - label: Posições
            name: positions
            widget: object
            hint: "Escolha o que aparece em cada posição do artigo — sem disputa automática entre rede e banner próprio, é você quem decide cada uma."
            fields:
              - label: "Topo do artigo (antes do texto começar)"
                name: top
                widget: select
                default: none
                options: &position_options
                  - { label: Nenhum, value: "none" }
                  - { label: "Anúncio de rede", value: "network" }
                  - { label: "Banner próprio", value: "own" }
              - label: "Meio do artigo"
                name: mid
                widget: select
                default: none
                options: *position_options
              - { label: "Meio do artigo aparece depois de quantos blocos de conteúdo", name: midAfterBlock, widget: number, default: 4, hint: "Cada parágrafo, título ou bloco rico (STEPS, FAQ, CHECKLIST...) conta como 1 bloco." }
              - label: "Antes do bloqueio de artigo premium"
                name: beforePaywall
                widget: select
                default: none
                options: *position_options

  - name: vitrine_artigo
    label: "Vitrine dentro dos artigos"
    files:
      - name: vitrine_artigo
        label: "Publicidade própria nos artigos do blog"
        file: content/vitrine-artigo.json
        fields:
          - label: "Banner no meio do artigo"
            name: inArticleBanner
            widget: object
            hint: "O bloco com foto que aparece encaixado no meio do texto do artigo. Só aparece em artigos que NÃO são premium."
            fields:
              - { label: "Mostrar este banner", name: enabled, widget: boolean, default: true }
              - label: "Onde colocar"
                name: position
                widget: select
                default: "meio"
                options: &vitrine_position_options
                  - { label: "Não mostrar em nenhum artigo", value: "none" }
                  - { label: "Meio do artigo (calculado automaticamente)", value: "meio" }
                  - { label: "Depois de um bloco específico", value: "bloco" }
                hint: "\"Meio do artigo\" se ajusta sozinho ao tamanho de cada artigo. Escolha \"Depois de um bloco específico\" pra fixar sempre no mesmo lugar (ex. sempre depois do 4º bloco), não importa o tamanho do artigo."
              - { label: "Se for \"Depois de um bloco específico\": depois de qual bloco (1, 2, 3...)", name: afterBlock, widget: number, default: 4, min: 1, hint: "Cada parágrafo, título ou bloco rico (STEPS, FAQ, CHECKLIST...) conta como 1 bloco." }
              - { label: Selo, name: kicker, widget: string }
              - { label: Título, name: title, widget: string }
              - { label: Foto, name: image, widget: image, required: false, hint: "Tamanho ideal: 1200×675px (proporção 16:9), foto na horizontal e ampla." }
              - { label: "Cor (barra e botão)", name: color, widget: color, hint: "Escolha a cor visualmente — o botão do banner usa essa cor." }
              - { label: "Texto do botão", name: ctaText, widget: string }
              - { label: "Link do botão", name: ctaHref, widget: string }
          - label: "Banner no fim do artigo"
            name: endArticleBanner
            widget: object
            hint: "A faixa de destaque que aparece depois do texto do artigo terminar (antes dos \"artigos relacionados\"). Aparece em todo artigo, inclusive premium."
            fields:
              - { label: "Mostrar este banner", name: enabled, widget: boolean, default: true }
              - label: "Onde colocar"
                name: position
                widget: select
                default: "fim"
                options: *vitrine_position_options
                hint: "Normalmente fica em \"Fim do artigo\" — é o formato de faixa larga, pensado pra fechar o artigo."
              - { label: "Se for \"Depois de um bloco específico\": depois de qual bloco (1, 2, 3...)", name: afterBlock, widget: number, default: 4, min: 1, hint: "Cada parágrafo, título ou bloco rico (STEPS, FAQ, CHECKLIST...) conta como 1 bloco." }
              - { label: Selo, name: kicker, widget: string }
              - { label: Título, name: title, widget: string }
              - { label: Texto, name: body, widget: text }
              - { label: "Cor (barra e botão)", name: color, widget: color, hint: "Escolha a cor visualmente — o botão do banner usa essa cor." }
              - { label: "Texto do botão", name: ctaText, widget: string }
              - { label: "Link do botão", name: ctaHref, widget: string }

