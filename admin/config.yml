backend:
  name: github
  repo: ingrydlts/ingrydlts.github.io
  branch: main
  base_url: https://por-dentro-cms-oauth.ingrydigitalmanagement.workers.dev
  auth_endpoint: auth

# Imagens enviadas pelo painel caem aqui e ficam disponíveis em /images/uploads/...
media_folder: "images/uploads"
public_folder: "/images/uploads"

locale: "pt"

collections:
  - name: nav_visibility
    label: "Cabeçalho e rodapé (menu do site)"
    files:
      - name: nav_visibility
        label: "Ativar/desativar o menu por página"
        file: content/nav-visibility.json
        fields:
          # Estúdio "Cabeçalho e rodapé" (admin/widgets/menu-studio.js):
          # tabela com as categorias e as páginas, e a página real como
          # prévia. Mesmo formato de sempre: categories.<categoria>.{header,
          # footer, logo} = true/false e pages.<página>.{header, footer, logo}
          # = "categoria" | "ativado" | "desativado".
          - label: "Ligar/desligar tudo de uma vez, por categoria"
            name: categories
            widget: studio-part
            hint: "As categorias ficam na tabela do estúdio, logo abaixo."
          - label: "Cada página"
            name: pages
            widget: visibility-studio

  - name: links_page
    label: "Página de Links (bio)"
    files:
      - name: links_page
        label: "Conteúdo da /links/"
        file: content/links.json
        fields:
          # Estúdio da Link na bio (admin/widgets/links-studio.js): topo,
          # card do assistente e seções/links com arrastar e soltar, e a
          # /links/ de verdade como prévia. Mesmos campos de sempre: hero
          # {handle, title, bio, avatar, instagramUrl, youtubeUrl}, bot
          # {title, description, href}, sections[{title, items[{active, icon,
          # title, description, href, trackId, external, price}]}].
          - label: "Topo (foto, bio, redes)"
            name: hero
            widget: studio-part
            hint: "O topo é editado no estúdio, logo abaixo."
          - label: "Card do assistente (bot)"
            name: bot
            widget: studio-part
            hint: "O card do assistente é editado no estúdio, logo abaixo."
          - label: "Seções de links"
            name: sections
            widget: links-studio

  - name: produtos_digitais
    label: "Produtos digitais"
    files:
      - name: produtos_digitais
        label: "Lista de produtos digitais"
        file: content/produtos-digitais.json
        fields:
          # Estúdio de produtos (admin/widgets/product-studio.js): lista,
          # galeria, "O que inclui", FAQ e combo com arrastar e soltar, e a
          # página real do produto como prévia. Grava os MESMOS campos de
          # sempre em content/produtos-digitais.json: active, slug, title,
          # kicker, summary, description, image, gallery[{type, image,
          # videoUrl, caption}], price, priceOld, launchNote, guaranteeDays,
          # features[], faq[{q, a}], stripeLink, bundleWith[] — e, opcional,
          # nextSteps[{title, text}]: os próximos passos da tela de compra
          # confirmada (/produtos-digitais/obrigado/).
          - label: Produtos
            name: items
            widget: product-studio

  - name: produtos_estudo
    label: "Produtos de estudo (afiliados)"
    files:
      - name: produtos_estudo
        label: "Lista de indicações de estudo"
        file: content/produtos-estudo.json
        fields:
          - label: Itens
            name: items
            widget: list
            summary: "{{title}}"
            fields:
              - { label: "🔴 Ativo no site", name: active, widget: boolean, default: true, required: false, hint: "Botão de ativação: desligado = produto fica cadastrado mas INVISÍVEL no site — some da lista de produtos de estudo e de qualquer banner de artigo que o indique. Ligue quando quiser que ele apareça de verdade." }
              - { label: Título, name: title, widget: string }
              - { label: Descrição curta, name: desc, widget: string }
              - { label: Imagem, name: image, widget: image, required: false, hint: "Tamanho ideal: 1200×900px (proporção 4:3), foto na horizontal. Aparece no card da lista." }
              - { label: "Link de afiliado", name: affiliateUrl, widget: string, required: false }

  - name: produtos_compras
    label: "Produtos de compras (afiliados)"
    files:
      - name: produtos_compras
        label: "Lista de indicações de compras"
        file: content/produtos-compras.json
        fields:
          - label: Itens
            name: items
            widget: list
            summary: "{{title}}"
            fields:
              - { label: Título, name: title, widget: string }
              - { label: Descrição curta, name: desc, widget: string }
              - { label: Imagem, name: image, widget: image, required: false, hint: "Tamanho ideal: 1200×900px (proporção 4:3), foto na horizontal. Aparece no card da lista." }
              - { label: "Link de afiliado", name: affiliateUrl, widget: string, required: false }

  - name: posts
    label: "Blog — artigos"
    files:
      - name: posts
        label: "Lista de artigos"
        file: content/posts.json
        fields:
          - label: Artigos
            name: items
            widget: list
            summary: "{{title}} ({{category}})"
            fields:
              - label: "🔴 Status"
                name: status
                widget: select
                default: "ideia"
                options:
                  - { label: "💡 Ideia", value: "ideia" }
                  - { label: "✍️ Escrevendo", value: "escrevendo" }
                  - { label: "👀 Revisão", value: "revisao" }
                  - { label: "🗓️ Agendado (entra no ar na data de publicação)", value: "agendado" }
                  - { label: "🟢 Publicado no site", value: "publicado" }
                hint: "Só \"Publicado no site\" aparece pra leitora — e \"Agendado\" entra no ar sozinho quando chega a \"Data de publicação\" (mais abaixo). Nas outras etapas o artigo fica INVISÍVEL: fora da home, do blog, dos filtros de categoria, do \"Veja também\" e dos banners que puxam artigo; quem abrir o link direto cai num aviso de \"ainda não publicado\"."
              - { label: "Slug (parte da URL, sem espaço/acento)", name: slug, widget: string }
              - { label: Título, name: title, widget: string }
              - { label: "Resumo (aparece no card)", name: excerpt, widget: string }
              - { label: "Categoria (usada nos filtros)", name: category, widget: string }
              - { label: "Foto de capa", name: image, widget: image, required: false, hint: "Tamanho ideal: 1600×900px (proporção 16:9), foto na horizontal e bem ampla. A mesma foto aparece cortada no card do blog (mais quadrada) e larga no topo do artigo — por isso precisa ser bem panorâmica." }
              - { label: "Mostrar a foto de capa dentro do artigo", name: showCoverInArticle, widget: boolean, default: true, required: false, hint: "Desligue pra pular a foto grande no topo do artigo (ex. artigos sem uma boa foto, ou que você quer que comecem direto pelo texto). A foto continua aparecendo normalmente no card da lista de artigos — isso só afeta o topo do artigo em si." }
              - label: "Galeria de fotos"
                name: gallery
                widget: list
                required: false
                min: 0
                summary: "{{fields.caption}}"
                hint: "Fotos extras do artigo, além da capa. Aparecem em carrossel com legenda onde você colocar o marcador [[GALERIA]] no corpo do artigo (só funciona com pelo menos 1 foto aqui — sem foto nenhuma, o marcador não mostra nada)."
                fields:
                  - { label: Foto, name: image, widget: image, hint: "Tamanho ideal: 1200×900px (proporção 4:3), foto na horizontal." }
                  - { label: "Legenda (opcional)", name: caption, widget: string, required: false }
              - label: "Galeria de fotos 2"
                name: gallery2
                widget: list
                required: false
                min: 0
                summary: "{{fields.caption}}"
                hint: "Uma segunda galeria, pra quando o artigo tem duas paradas/momentos diferentes pra ilustrar. Aparece onde você colocar o marcador [[GALERIA-2]] no corpo do artigo."
                fields:
                  - { label: Foto, name: image, widget: image, hint: "Tamanho ideal: 1200×900px (proporção 4:3), foto na horizontal." }
                  - { label: "Legenda (opcional)", name: caption, widget: string, required: false }
              - { label: "Mostrar \"← Voltar aos artigos\"", name: showBackLink, widget: boolean, default: true, required: false, hint: "Desligue pra tirar o link \"← Voltar aos artigos\" do topo desta página — útil junto com \"Cabeçalho desta página\" desativado, pra transformar o artigo numa landing isolada, sem nenhum caminho de volta pro blog." }
              - { label: "Data de publicação", name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
              - { label: "Última atualização", name: updatedDate, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, required: false, hint: "Aparece no topo do artigo como \"Atualizado em\". Mude essa data sempre que revisar ou corrigir o conteúdo — é o que mostra pra leitora que a informação ainda é confiável." }
              - { label: "Tempo de leitura (min)", name: readMinutes, widget: number, required: false }
              - label: "Corpo do artigo"
                name: body
                widget: article-composer
                hint: "Clique em \"Editar artigo visualmente\" pra abrir o editor em blocos, no MESMO layout que a leitora vê no site (funciona bem no celular). Cada parágrafo, título, imagem, banner ou link é um bloco independente: toque num bloco pra editar o conteúdo dele, arraste pela alcinha \"⠿\" (com o dedo ou o mouse) ou use as setas ▲▼ pra reordenar, e o \"🗑\" apaga. O botão \"+\" flutuante (canto inferior direito) abre a lista de blocos pra adicionar — Parágrafo, Título, Lista, FAQ, Checklist, Recursos, Passo a passo, Enquete, Faixa de destaque, Números, Cartões, Banner de vitrine, Link afiliado e Galeria. O novo bloco entra logo depois do bloco em que você tocou por último (ou no fim, se nada estiver selecionado).\n\n🎯 \"Banner de vitrine\": adicione pelo \"+\" — sem nenhum bloco de banner no artigo, ele segue o padrão configurado em \"Vitrine dentro dos artigos\"; adicionar \"Banner de vitrine\" força aparecer aqui (arraste pra escolher a posição, toque nele pra escolher QUAL produto aparece — lista tudo que já está cadastrado em \"Produtos digitais\", \"Produtos de estudo\" e \"Produtos de compras\", puxando título, imagem e link automaticamente, ou deixe em \"Genérico\" pra usar o texto de \"Vitrine dentro dos artigos\"); adicionar \"Sem banner aqui\" força NÃO aparecer neste artigo, mesmo com o padrão do site ligado. Apagar o bloco volta ao padrão do site.\n\n🔗 \"Card de afiliado\" (no \"+\"): adicione quantos precisar — cada um é um bloco de link independente (texto do botão, URL de afiliado e imagem opcional), arrastável pra qualquer posição do artigo. Sem limite de quantidade.\n\n⚠️ TODO artigo precisa terminar com um bloco FAQ (nunca solto no texto) e um bloco de Feedback — é a regra de captação de audiência do site (ver README.md e GUIA-DE-IMPLEMENTACAO.md). Use Checklist quando o tema tiver um critério de elegibilidade ou passo a passo verificável, e Recursos pra toda fonte oficial citada — cada pergunta aberta e cada fonte clicada vira dado em /admin/dashboard.\n\nBotão \"Ver texto bruto\", no topo do editor visual, mostra o markdown puro — útil pra colar um bloco rico pronto (cole exatamente assim, cada linha com \"|\" separando as colunas):\n[[STEPS]]\nTítulo do passo | Descrição\n[[/STEPS]]\n\n[[FAQ]] (obrigatório)\nPergunta | Resposta\n[[/FAQ]]\n\n[[RESOURCES]]\nTítulo | Descrição | Texto do link | URL\n[[/RESOURCES]]\n\n[[CHECKLIST]]\nTítulo da checklist\nItem 1\nItem 2\n[[/CHECKLIST]]\n\n[[FEEDBACK]] (obrigatório)\nPergunta (opcional)\n[[/FEEDBACK]]\n\nTambém dá pra usar [[BAND]], [[STATS]], [[CARDS]] e [[LIST]] — mesmo formato de colunas com \"|\"."
              - { label: "URL fixa (não editar manualmente)", name: url, widget: string, required: false, hint: "Usado internamente para os artigos que têm página própria. Deixe como está — não apague nem edite este campo." }
              - label: "Cabeçalho desta página"
                name: headerMode
                widget: select
                default: "categoria"
                required: false
                options:
                  - { label: "Seguir a categoria Blog (definida em \"Cabeçalho e rodapé\")", value: "categoria" }
                  - { label: Ativado, value: "ativado" }
                  - { label: "Desativado — só a logo, sem menu (landing de pré-lançamento)", value: "desativado" }
                hint: "Use \"Desativado\" pra transformar este artigo numa landing page isolada, sem links pra partes do site que ainda não lançaram. Depois do lançamento, volte pra \"Seguir a categoria Blog\"."
              - label: "Rodapé desta página"
                name: footerMode
                widget: select
                default: "categoria"
                required: false
                options:
                  - { label: "Seguir a categoria Blog (definida em \"Cabeçalho e rodapé\")", value: "categoria" }
                  - { label: Ativado, value: "ativado" }
                  - { label: "Desativado — esconde o menu de navegação do rodapé", value: "desativado" }
                hint: "Mesma lógica do cabeçalho, mas pro bloco \"Navegação\" do rodapé (os links pra Produtos, Blog, Sobre etc. lá embaixo da página)."
              - label: "Logo redireciona pra Home, nesta página"
                name: logoMode
                widget: select
                default: "categoria"
                required: false
                options:
                  - { label: "Seguir a categoria Blog (definida em \"Cabeçalho e rodapé\")", value: "categoria" }
                  - { label: Ativado, value: "ativado" }
                  - { label: "Desativado — a logo aparece, mas não é um link", value: "desativado" }
                hint: "Afeta a logo no cabeçalho E no rodapé da página, ao mesmo tempo. Desative junto com o Cabeçalho quando este artigo for uma landing isolada — assim nem a logo leva de volta pro site."

  - name: header_config
    label: "Cabeçalho do site"
    files:
      - name: header_config
        label: "Links do menu (cabeçalho)"
        file: content/header-config.json
        fields:
          # Estúdio do menu (admin/widgets/menu-studio.js): arrastar pra mudar
          # a ordem, texto, endereço e liga/desliga de cada link. Mesmo
          # formato: links.<chave>.{enabled, label, href}; a ordem das chaves
          # é a ordem no site (ver orderLinks em assets/js/header.js).
          - label: "Menu principal"
            name: links
            widget: menu-studio

  - name: quiz_config
    label: "Questionário de vagas limitadas (/acesso-vip/)"
    files:
      - name: quiz_config
        label: "Página e formulário"
        file: content/quiz-config.json
        fields:
          - label: "Aba do navegador"
            name: meta
            widget: object
            fields:
              - { label: "Título da página (aba do navegador)", name: pageTitle, widget: string }
              - { label: "Descrição (SEO/compartilhamento)", name: description, widget: text }
          - label: "Topo da página"
            name: hero
            widget: object
            fields:
              - { label: "Selo acima do título", name: eyebrow, widget: string, default: "Vagas limitadas — só 10 pessoas" }
              - { label: "Título — linha principal (negrito)", name: titleMain, widget: string, hint: "Ex.: \"Teste minha planilha financeira\" — mesmo estilo tipográfico do post/story de divulgação." }
              - { label: "Título — linha de destaque (dourado, itálico)", name: titleAccent, widget: string, hint: "Ex.: \"10 vagas grátis\" — o número/oferta-chave, igual à segunda linha do post." }
              - { label: Subtítulo, name: subtitle, widget: text }
              - { label: "Subtítulo — trecho em destaque (negrito e sublinhado)", name: subtitleHighlight, widget: string, hint: "Aparece em negrito e sublinhado logo depois do subtítulo — ex.: \"Em troca só do seu feedback.\"" }
              - { label: "Texto ao lado do número de vagas", name: vagasLabel, widget: string, default: "vagas restantes" }
              - { label: "Total de vagas mostrado no contador", name: vagasTotalDisplay, widget: number, default: 20, hint: "Some grátis + pagas (ex.: 10 grátis + 10 pagas = 20) — evita o contador zerar e parecer encerrado assim que as gratuitas acabarem. Não conta as vagas pagas em tempo real (o pagamento é feito no Stripe, sem passar de novo pelo formulário)." }
          - label: "Como funciona (antes do formulário)"
            name: howItWorks
            widget: object
            hint: "Aparece entre o topo da página e o formulário — mostra o que a pessoa vai testar e o que esperar, antes de pedir pra ela responder."
            fields:
              - { label: "Selo acima do título", name: eyebrow, widget: string, default: "Como funciona o teste" }
              - { label: Título, name: title, widget: string, default: "O que você vai testar" }
              - label: "Destaques do produto"
                name: items
                widget: list
                hint: "Cada item vira um bloco com ícone + título curto + descrição — pensado pra leitura rápida, não frase longa."
                fields: &how_item_fields
                  - { label: "Ícone", name: icon, widget: select, options: ["chart", "cycle", "target", "calendar", "beta", "discount", "star", "check", "clock", "money", "heart", "lightbulb", "copy", "message"], default: "star" }
                  - { label: "Título curto (palavra-chave ou número)", name: title, widget: string }
                  - { label: "Descrição curta (1 linha)", name: description, widget: string }
              - { label: "Título do bloco \"o que esperar\"", name: expectationsTitle, widget: string, default: "O que esperar" }
              - label: "Itens do \"o que esperar\" (duração do teste, versão beta, cupom, etc.)"
                name: expectations
                widget: list
                hint: "Mesmo formato dos destaques acima: ícone + título curto (ex. \"7 dias\", \"50% OFF\") + descrição de 1 linha."
                fields: *how_item_fields
          - label: "Formulário"
            name: form
            widget: object
            fields:
              - { label: "Texto do botão de enviar", name: submitLabel, widget: string, default: "Quero minha vaga" }
              - { label: "Texto do botão enquanto envia", name: loadingLabel, widget: string, default: "Enviando..." }
              - { label: "Aviso de privacidade (abaixo do botão)", name: privacyNote, widget: text }
              - label: "Perguntas do questionário"
                name: questions
                widget: list
                hint: "Nome, e-mail e Instagram já são pedidos automaticamente, não precisa adicionar aqui — essas perguntas são as de qualificação/interesse."
                fields:
                  - { label: "Identificador (sem espaços, ex. dificuldade)", name: id, widget: string }
                  - { label: Pergunta, name: label, widget: string }
                  - { label: "Tipo de resposta", name: type, widget: select, options: ["text", "textarea", "select"], default: "text" }
                  - { label: "Obrigatória?", name: required, widget: boolean, default: true }
                  - { label: "Texto de exemplo (só pro tipo texto/parágrafo)", name: placeholder, widget: string, required: false }
                  - { label: "Opções (só pro tipo múltipla escolha, 1 por linha)", name: options, widget: list, field: { label: Opção, name: option, widget: string }, required: false }
          - label: "Tela de sucesso (vaga liberada)"
            name: success
            widget: object
            fields:
              - { label: Título, name: title, widget: string }
              - { label: "Texto (introdução curta)", name: body, widget: text }
              - label: "Próximos passos (ícone + título + descrição)"
                name: steps
                widget: list
                hint: "Ex.: duplicar e renomear a planilha, contato pelo direct, retorno em ~14 dias."
                fields: *how_item_fields
              - { label: "Texto do botão do Drive", name: ctaLabel, widget: string, default: "Abrir material no Google Drive" }
              - { label: "Aviso se o link ainda não foi configurado", name: pendingLinkNotice, widget: text }
          - label: "Tela de vagas encerradas"
            name: locked
            widget: object
            fields:
              - { label: Título, name: title, widget: string }
              - { label: "Texto (opcional — deixe em branco pra ir direto pra oferta abaixo)", name: body, widget: text, required: false }
              - label: "Oferta da Etapa 2 (paga)"
                name: etapa2
                widget: object
                fields:
                  - { label: "Mostrar esta oferta?", name: enabled, widget: boolean, default: true }
                  - { label: Título, name: title, widget: string }
                  - { label: "Subtítulo do benefício", name: benefitTitle, widget: string, default: "O que você recebe em troca", hint: "Aparece como um subtítulo, acima do bloco de destaque abaixo." }
                  - { label: "Ícone do bloco de destaque", name: benefitIcon, widget: select, options: ["chart", "cycle", "target", "calendar", "beta", "discount", "star", "check", "clock", "money", "heart", "lightbulb", "copy", "message"], default: "discount" }
                  - { label: "Número/palavra-chave do bloco de destaque", name: benefitStat, widget: string, default: "100% OFF" }
                  - { label: "Descrição do bloco de destaque (1 linha)", name: benefitDescription, widget: string }
                  - { label: "Texto (o porquê do valor)", name: body, widget: text }
                  - { label: "Texto do preço", name: priceLabel, widget: string, default: "6€" }
                  - { label: "Texto do botão", name: ctaLabel, widget: string, default: "Quero ser tester Premium" }
                  - { label: "Link de pagamento do Stripe (reserva, se o checkout embutido falhar)", name: link, widget: string, required: false, hint: "Payment Link do Stripe (produto de 5€) — usado só como reforço se o formulário de cartão embutido não carregar." }
                  - { label: "Publishable Key do Stripe (pk_live_... ou pk_test_...)", name: stripePublishableKey, widget: string, required: false, hint: "Stripe → Developers → API keys. É segura de expor — o formulário de cartão só aparece na tela se esse campo estiver preenchido." }
                  - { label: "Aviso enquanto o pagamento não está configurado", name: pendingNotice, widget: text }
          - label: "Perguntas frequentes"
            name: faq
            widget: list
            fields:
              - { label: Pergunta, name: q, widget: string }
              - { label: Resposta, name: a, widget: text }

  - name: analytics_config
    label: "Consentimento e cookies"
    files:
      - name: analytics_config
        label: "Banner de consentimento"
        file: content/analytics-config.json
        fields:
          - { label: "Ligar/desligar toda a medição de audiência", name: trackingEnabled, widget: boolean, default: true, hint: "Desligado = o banner nunca aparece e nada é medido (nem quando o Google Analytics/Clarity forem ativados). É o interruptor de emergência." }
          - { label: "ID de medição do Google Analytics (GA4)", name: ga4MeasurementId, widget: string, required: false, hint: "Formato G-XXXXXXXXXX. Encontre em analytics.google.com → Administrador → Fluxos de dados → seu site → \"ID da métrica\". Deixe em branco pra não carregar o GA4." }
          - { label: "ID do projeto Microsoft Clarity", name: clarityProjectId, widget: string, required: false, hint: "Encontre em clarity.microsoft.com → seu projeto → Settings → Overview → \"Project ID\" (só o código, sem o resto do link). Deixe em branco pra não carregar o Clarity." }
          - { label: "ID de parceiro GetYourGuide", name: gygPartnerId, widget: string, required: false, hint: "Ativa o widget \"GetYourGuide Analytics\" em todo o site (o mesmo que mostra passeios/atividades e mede cliques de afiliado). Encontre em partner.getyourguide.com → Integrations → \"Install integration analyzer\" — é o valor de data-gyg-partner-id no código deles (ex.: MZA262B). Deixe em branco pra não carregar." }
          - label: "Texto do banner"
            name: consentBanner
            widget: object
            fields:
              - { label: Título, name: title, widget: string }
              - { label: "Texto explicativo", name: body, widget: text }
              - { label: "Botão de aceitar", name: acceptLabel, widget: string, default: "Aceitar" }
              - { label: "Botão de recusar", name: declineLabel, widget: string, default: "Recusar" }
              - { label: "Texto do link \"saiba mais\"", name: linkLabel, widget: string, default: "Saiba mais" }
              - { label: "Link do \"saiba mais\"", name: linkHref, widget: string, default: "/confidentialite/" }

  - name: ads_config
    label: "Anúncios nos artigos"
    files:
      - name: ads_config
        label: "Posições e anúncios"
        file: content/ads-config.json
        fields:
          - { label: "Ligar/desligar todos os anúncios", name: enabled, widget: boolean, default: true, hint: "Desligado = nenhum anúncio aparece em lugar nenhum, mesmo que as posições abaixo estejam preenchidas. É o interruptor de emergência — útil pra pausar tudo rápido, sem mexer em código." }
          - label: "Anúncio de rede (ex. Google AdSense)"
            name: network
            widget: object
            hint: "Cole aqui exatamente o código que a rede de anúncios te der."
            fields:
              - { label: "Código do <head> (carrega a rede — aparece 1x por página, só se algum anúncio de rede estiver ativo)", name: headSnippet, widget: text, required: false }
              - { label: "Código do anúncio (o bloco em si, repete em cada posição marcada como \"Anúncio de rede\" abaixo)", name: adSnippet, widget: text, required: false }
          - label: "Banner próprio (promove seus produtos)"
            name: ownBanner
            widget: object
            hint: "Aparece nas posições marcadas como \"Banner próprio\" abaixo — o mesmo banner em todas elas."
            fields:
              - { label: Selo, name: kicker, widget: string, required: false }
              - { label: Título, name: title, widget: string, required: false }
              - { label: Texto, name: body, widget: text, required: false }
              - { label: "Cor (hex)", name: color, widget: string, required: false }
              - { label: "Texto do botão", name: ctaText, widget: string, required: false }
              - { label: "Link do botão", name: ctaHref, widget: string, required: false }
          - label: Posições
            name: positions
            widget: object
            hint: "Escolha o que aparece em cada posição do artigo — sem disputa automática entre rede e banner próprio, é você quem decide cada uma."
            fields:
              - label: "Topo do artigo (antes do texto começar)"
                name: top
                widget: select
                default: none
                options: &position_options
                  - { label: Nenhum, value: "none" }
                  - { label: "Anúncio de rede", value: "network" }
                  - { label: "Banner próprio", value: "own" }
              - label: "Meio do artigo"
                name: mid
                widget: select
                default: none
                options: *position_options
              - { label: "Meio do artigo aparece depois de quantos blocos de conteúdo", name: midAfterBlock, widget: number, default: 4, hint: "Cada parágrafo, título ou bloco rico (STEPS, FAQ, CHECKLIST...) conta como 1 bloco." }

  - name: vitrine_artigo
    label: "Vitrine dentro dos artigos"
    files:
      - name: vitrine_artigo
        label: "Publicidade própria nos artigos do blog"
        file: content/vitrine-artigo.json
        fields:
          - label: "Banner no meio do artigo"
            name: inArticleBanner
            widget: object
            hint: "O bloco com foto que aparece encaixado no meio do texto do artigo."
            fields:
              - { label: "Mostrar este banner", name: enabled, widget: boolean, default: true }
              - label: "Onde colocar"
                name: position
                widget: select
                default: "meio"
                options: &vitrine_position_options
                  - { label: "Não mostrar em nenhum artigo", value: "none" }
                  - { label: "Meio do artigo (calculado automaticamente)", value: "meio" }
                  - { label: "Depois de um bloco específico", value: "bloco" }
                hint: "\"Meio do artigo\" se ajusta sozinho ao tamanho de cada artigo. Escolha \"Depois de um bloco específico\" pra fixar sempre no mesmo lugar (ex. sempre depois do 4º bloco), não importa o tamanho do artigo."
              - { label: "Se for \"Depois de um bloco específico\": depois de qual bloco (1, 2, 3...)", name: afterBlock, widget: number, default: 4, min: 1, hint: "Cada parágrafo, título ou bloco rico (STEPS, FAQ, CHECKLIST...) conta como 1 bloco." }
              - { label: Selo, name: kicker, widget: string }
              - { label: Título, name: title, widget: string }
              - { label: Foto, name: image, widget: image, required: false, hint: "Tamanho ideal: 1200×675px (proporção 16:9), foto na horizontal e ampla." }
              - { label: "Cor (barra e botão)", name: color, widget: color, hint: "Escolha a cor visualmente — o botão do banner usa essa cor." }
              - { label: "Texto do botão", name: ctaText, widget: string }
              - { label: "Link do botão", name: ctaHref, widget: string }
          - label: "Banner no fim do artigo"
            name: endArticleBanner
            widget: object
            hint: "A faixa de destaque que aparece depois do texto do artigo terminar (antes dos \"artigos relacionados\"). Aparece em todo artigo."
            fields:
              - { label: "Mostrar este banner", name: enabled, widget: boolean, default: true }
              - label: "Onde colocar"
                name: position
                widget: select
                default: "fim"
                options: *vitrine_position_options
                hint: "Normalmente fica em \"Fim do artigo\" — é o formato de faixa larga, pensado pra fechar o artigo."
              - { label: "Se for \"Depois de um bloco específico\": depois de qual bloco (1, 2, 3...)", name: afterBlock, widget: number, default: 4, min: 1, hint: "Cada parágrafo, título ou bloco rico (STEPS, FAQ, CHECKLIST...) conta como 1 bloco." }
              - { label: Selo, name: kicker, widget: string }
              - { label: Título, name: title, widget: string }
              - { label: Texto, name: body, widget: text }
              - { label: "Cor (barra e botão)", name: color, widget: color, hint: "Escolha a cor visualmente — o botão do banner usa essa cor." }
              - { label: "Texto do botão", name: ctaText, widget: string }
              - { label: "Link do botão", name: ctaHref, widget: string }

  - name: banners
    label: "Banners e destaques"
    files:
      - name: banners
        label: "Banners do site"
        file: content/banners.json
        fields:
          - label: Home
            name: home
            widget: object
            fields:
              - { label: "Foto do hero (mobile)", name: heroImage, widget: image, required: false, hint: "Foto na vertical (proporção 2:3). Usada em telas menores que 900px." }
              - { label: "Foto do hero (desktop)", name: heroImageDesktop, widget: image, required: false, hint: "Foto na horizontal (proporção 3:2). Usada em telas a partir de 900px." }
              - { label: "Texto alternativo da foto", name: heroImageAlt, widget: string, required: false }
          - label: "Banners vitrine → blog (um por categoria)"
            name: categoryBanners
            widget: object
            fields:
              - label: "Produtos digitais"
                name: produtos-digitais
                widget: object
                fields:
                  - { label: "Mostrar este banner?", name: enabled, widget: boolean, default: true, hint: "Desative pra esconder o bloco na página sem apagar o conteúdo." }
                  - { label: Selo, name: kicker, widget: string }
                  - { label: Título, name: title, widget: string }
                  - { label: Foto, name: image, widget: image, required: false, hint: "Tamanho ideal: 1200×675px (proporção 16:9), foto na horizontal e ampla." }
                  - { label: "Cor (hex)", name: color, widget: string }
                  - { label: "Texto do botão", name: ctaText, widget: string }
                  - { label: "Slug do artigo pra onde o botão leva", name: postSlug, widget: string }
              - label: "Produtos de estudo"
                name: produtos-de-estudo
                widget: object
                fields:
                  - { label: "Mostrar este banner?", name: enabled, widget: boolean, default: true, hint: "Desative pra esconder o bloco na página sem apagar o conteúdo." }
                  - { label: Selo, name: kicker, widget: string }
                  - { label: Título, name: title, widget: string }
                  - { label: Foto, name: image, widget: image, required: false, hint: "Tamanho ideal: 1200×675px (proporção 16:9), foto na horizontal e ampla." }
                  - { label: "Cor (hex)", name: color, widget: string }
                  - { label: "Texto do botão", name: ctaText, widget: string }
                  - { label: "Slug do artigo pra onde o botão leva", name: postSlug, widget: string }
              - label: "Produtos de compras"
                name: produtos-de-compras
                widget: object
                fields:
                  - { label: "Mostrar este banner?", name: enabled, widget: boolean, default: true, hint: "Desative pra esconder o bloco na página sem apagar o conteúdo." }
                  - { label: Selo, name: kicker, widget: string }
                  - { label: Título, name: title, widget: string }
                  - { label: Foto, name: image, widget: image, required: false, hint: "Tamanho ideal: 1200×675px (proporção 16:9), foto na horizontal e ampla." }
                  - { label: "Cor (hex)", name: color, widget: string }
                  - { label: "Texto do botão", name: ctaText, widget: string }
                  - { label: "Slug do artigo pra onde o botão leva", name: postSlug, widget: string }
          - label: "Banner lateral do blog (promove um produto)"
            name: blogSidebar
            widget: object
            fields:
              - { label: Selo, name: kicker, widget: string }
              - { label: Título, name: title, widget: string }
              - { label: Texto, name: body, widget: text }
              - { label: Foto, name: image, widget: image, required: false, hint: "Tamanho ideal: 1200×900px (proporção 4:3), foto na horizontal." }
              - { label: "Cor (hex)", name: color, widget: string }
              - { label: "Texto do botão", name: ctaText, widget: string }
              - { label: "Link do botão", name: ctaHref, widget: string }
