<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #BB9351; }
    a:hover { color: #DEB975; }
  </style>
</helmet>

<div style="position: relative; width: 1600px; height: 900px; overflow: hidden; font-family: 'Inter', sans-serif; background: #F4F1EC; display: flex;">

  <div style="position: relative; width: 620px; height: 900px; flex: 0 0 auto; background: #2B2B2B; padding: 48px 56px; display: flex; flex-direction: column;">
    <div style="position: absolute; top: 0; left: 0; width: 6px; height: 900px; background: linear-gradient(180deg, #BB9351 0%, #DEB975 100%);"></div>

    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div style="display: flex; align-items: center; gap: 14px;">
        <div style="width: 32px; height: 2px; background: #DEB975;"></div>
        <div style="color: #F4F1EC; font-size: 14px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;">Por Dentro &middot; Au Pair</div>
      </div>
      <img src="logo-por-dentro.png" alt="Por Dentro" style="width: 46px; height: auto;">
    </div>

    <div style="margin-top: 28px; display: inline-flex; align-self: flex-start; align-items: center; gap: 8px; padding: 7px 14px; border: 1px solid rgba(222,185,117,0.5); border-radius: 999px;">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#DEB975" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"></path><polyline points="21 3 21 9 15 9"></polyline></svg>
      <div style="color: #F4F1EC; font-size: 12px; font-weight: 500; letter-spacing: 0.02em;">Atualizado em 02/09/2026</div>
    </div>

    <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; margin-top: -20px;">
      <div style="font-family: 'Fraunces', serif; font-weight: 600; font-size: 108px; line-height: 0.98; color: #F4F1EC; letter-spacing: -0.01em;">Au<br>Pair</div>
      <div style="margin-top: 26px; max-width: 460px; font-size: 21px; line-height: 1.45; color: rgba(244,241,236,0.82); font-weight: 400;">O que &eacute; ser au pair, onde se candidatar e os riscos reais do programa na Fran&ccedil;a.</div>
    </div>

    <div style="display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 24px;">
      <div style="font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #DEB975;">AuPairWorld</div>
      <div style="font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #DEB975;">DREETS</div>
      <div style="font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #DEB975;">Rematch</div>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; padding-top: 18px; border-top: 1px solid rgba(222,185,117,0.35);">
      <div style="color: #F4F1EC; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;">Au Pair</div>
      <div style="color: rgba(244,241,236,0.7); font-size: 13px; font-weight: 500; letter-spacing: 0.04em;">Leitura &middot; 9 min</div>
    </div>
  </div>

  <div style="position: relative; flex: 1 1 auto; height: 900px; overflow: hidden;">
    <img src="bg4-crop-final.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 55% 35%;">
    <div style="position: absolute; inset: 0; background: linear-gradient(90deg, rgba(43,43,43,0.28) 0%, rgba(43,43,43,0) 14%);"></div>
  </div>
</div>
</x-dc>
</body>
</html>
