<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 770" role="img" aria-labelledby="t d"><title id="t">Setores tarifários dos médicos na França</title><desc id="d">Quatro níveis: secteur 1 com um euro, secteur 2 OPTAM e secteur 2 livre com dois euros, secteur 3 com três euros.</desc><rect width="800" height="770" fill="#F4F1EC"/><text x="400" y="60" font-size="40" fill="#2B2B2B" font-weight="600" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif">Os símbolos do Doctolib</text><text x="400" y="98" font-size="24" fill="#5E5852" font-weight="400" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Eles mostram o setor tarifário do médico</text><rect x="60" y="140" width="680" height="120" rx="22" fill="#fff" stroke="#D9D2C6" stroke-width="2"/><circle cx="130" cy="200" r="42" fill="#577328"/><text x="130" y="212" font-size="34" fill="#fff" font-weight="700" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif">€</text><text x="205" y="192" font-size="30" fill="#2B2B2B" font-weight="600" text-anchor="start" font-family="Fraunces, Georgia, 'Times New Roman', serif">Secteur 1</text><text x="205" y="230" font-size="23" fill="#5E5852" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Tarifa oficial, sem honorário extra</text><rect x="60" y="285" width="680" height="120" rx="22" fill="#fff" stroke="#D9D2C6" stroke-width="2"/><circle cx="130" cy="345" r="42" fill="#B8933F"/><text x="130" y="357" font-size="34" fill="#fff" font-weight="700" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif">€€</text><text x="205" y="337" font-size="30" fill="#2B2B2B" font-weight="600" text-anchor="start" font-family="Fraunces, Georgia, 'Times New Roman', serif">Secteur 2 OPTAM</text><text x="205" y="375" font-size="23" fill="#5E5852" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Tem acordo que limita o extra cobrado</text><rect x="60" y="430" width="680" height="120" rx="22" fill="#fff" stroke="#D9D2C6" stroke-width="2"/><circle cx="130" cy="490" r="42" fill="#B8933F"/><text x="130" y="502" font-size="34" fill="#fff" font-weight="700" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif">€€</text><text x="205" y="482" font-size="30" fill="#2B2B2B" font-weight="600" text-anchor="start" font-family="Fraunces, Georgia, 'Times New Roman', serif">Secteur 2 livre</text><text x="205" y="520" font-size="23" fill="#5E5852" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Cobra extra sem teto fixado</text><rect x="60" y="575" width="680" height="120" rx="22" fill="#fff" stroke="#D9D2C6" stroke-width="2"/><circle cx="130" cy="635" r="42" fill="#9B2C2C"/><text x="130" y="647" font-size="34" fill="#fff" font-weight="700" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif">€€€</text><text x="205" y="627" font-size="30" fill="#2B2B2B" font-weight="600" text-anchor="start" font-family="Fraunces, Georgia, 'Times New Roman', serif">Secteur 3</text><text x="205" y="665" font-size="23" fill="#5E5852" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Fora do acordo público: preço livre</text><text x="400" y="728" font-size="24" fill="#604034" font-weight="600" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Pra gastar menos, procure secteur 1 ou OPTAM</text></svg>
