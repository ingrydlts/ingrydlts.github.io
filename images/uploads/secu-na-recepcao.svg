<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 740" role="img" aria-labelledby="t d"><title id="t">Quanto você paga na recepção do médico</title><desc id="d">Três situações numa consulta de 30 euros: com Carte Vitale e mutuelle você paga 0 euro, com Carte Vitale sem mutuelle paga 9 euros, só com NIA ou sem cartão paga 30 euros e pede reembolso.</desc><rect width="800" height="740" fill="#F4F1EC"/><text x="400" y="60" font-size="40" fill="#2B2B2B" font-weight="600" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif">Quanto você paga na recepção</text><text x="400" y="98" font-size="24" fill="#5E5852" font-weight="400" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Exemplo: consulta com generalista, secteur 1 (30 €)</text><rect x="60" y="140" width="680" height="150" rx="22" fill="#fff" stroke="#D9D2C6" stroke-width="2"/><rect x="60" y="140" width="12" height="150" rx="6" fill="#577328"/><text x="110" y="224" font-size="56" fill="#577328" font-weight="600" text-anchor="start" font-family="Fraunces, Georgia, 'Times New Roman', serif">0 €</text><text x="300" y="202" font-size="28" fill="#2B2B2B" font-weight="600" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Carte Vitale + mutuelle</text><text x="300" y="242" font-size="21" fill="#5E5852" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">O tiers payant paga a parte da Sécu</text><text x="300" y="270" font-size="21" fill="#5E5852" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">e da mutuelle direto na clínica</text><rect x="60" y="320" width="680" height="150" rx="22" fill="#fff" stroke="#D9D2C6" stroke-width="2"/><rect x="60" y="320" width="12" height="150" rx="6" fill="#B8933F"/><text x="110" y="404" font-size="56" fill="#B8933F" font-weight="600" text-anchor="start" font-family="Fraunces, Georgia, 'Times New Roman', serif">9 €</text><text x="300" y="382" font-size="28" fill="#2B2B2B" font-weight="600" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Carte Vitale, sem mutuelle</text><text x="300" y="422" font-size="21" fill="#5E5852" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Você paga os 30% restantes</text><text x="300" y="450" font-size="21" fill="#5E5852" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">na hora</text><rect x="60" y="500" width="680" height="150" rx="22" fill="#fff" stroke="#D9D2C6" stroke-width="2"/><rect x="60" y="500" width="12" height="150" rx="6" fill="#604034"/><text x="110" y="584" font-size="56" fill="#604034" font-weight="600" text-anchor="start" font-family="Fraunces, Georgia, 'Times New Roman', serif">30 €</text><text x="300" y="562" font-size="28" fill="#2B2B2B" font-weight="600" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Só NIA, ou sem cartão</text><text x="300" y="602" font-size="21" fill="#5E5852" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Você paga tudo e pede o reembolso</text><text x="300" y="630" font-size="21" fill="#5E5852" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">com a feuille de soins</text><text x="400" y="694" font-size="22" fill="#604034" font-weight="600" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">O tiers payant depende do cartão, do profissional e da sua mutuelle</text></svg>
