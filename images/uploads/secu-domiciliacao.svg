<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 740" role="img" aria-labelledby="t d"><title id="t">Duas saídas legais para quem não tem endereço no próprio nome</title><desc id="d">Dois cartões: moradia na casa de alguém, com atestado de hospedagem, e domiciliação, com atestado de eleição de domicílio. Hotel e Airbnb de curta temporada não valem.</desc><rect width="800" height="740" fill="#F4F1EC"/><text x="400" y="62" font-size="40" fill="#2B2B2B" font-weight="600" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif">Sem endereço no seu nome?</text><text x="400" y="102" font-size="24" fill="#5E5852" font-weight="400" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Existem duas saídas legais pra comprovar onde você mora</text><rect x="60" y="150" width="680" height="230" rx="22" fill="#fff" stroke="#D9D2C6" stroke-width="2"/><circle cx="130" cy="220" r="40" fill="#F4F1EC" stroke="#604034" stroke-width="3"/><path d="M108 222 L130 200 L152 222 M114 216 V240 H146 V216" fill="none" stroke="#604034" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="200" y="212" font-size="32" fill="#2B2B2B" font-weight="600" text-anchor="start" font-family="Fraunces, Georgia, 'Times New Roman', serif">1. Moradia na casa de alguém</text><text x="200" y="260" font-size="24" fill="#5E5852" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Atestado de hospedagem do anfitrião,</text><text x="200" y="296" font-size="24" fill="#5E5852" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">documento dele e um comprovante</text><text x="200" y="332" font-size="24" fill="#5E5852" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">recente de residência no nome dele</text><rect x="60" y="410" width="680" height="230" rx="22" fill="#fff" stroke="#D9D2C6" stroke-width="2"/><circle cx="130" cy="480" r="40" fill="#F4F1EC" stroke="#604034" stroke-width="3"/><rect x="108" y="458" width="44" height="44" rx="6" fill="none" stroke="#604034" stroke-width="4"/><path d="M119 480 L127 489 L142 471" fill="none" stroke="#577328" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="200" y="472" font-size="32" fill="#2B2B2B" font-weight="600" text-anchor="start" font-family="Fraunces, Georgia, 'Times New Roman', serif">2. Domiciliação</text><text x="200" y="520" font-size="24" fill="#5E5852" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Endereço administrativo oficial, pedido</text><text x="200" y="556" font-size="24" fill="#5E5852" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">ao CCAS/CIAS ou a associações</text><text x="200" y="592" font-size="24" fill="#5E5852" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">credenciadas. Atestado válido por 1 ano</text><text x="400" y="700" font-size="24" fill="#604034" font-weight="600" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Hotel e Airbnb de curta temporada não valem como prova</text></svg>
