<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">O prazo de 2 anos para enviar a feuille de soins</title><desc id="d">Linha do tempo com um exemplo: consulta em 6 de outubro de 2026 e último dia para enviar em 30 de dezembro de 2028, o fim do mesmo trimestre dois anos depois.</desc><rect width="800" height="520" fill="#F4F1EC"/><text x="400" y="62" font-size="40" fill="#2B2B2B" font-weight="600" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif">O prazo de 2 anos</text><text x="400" y="102" font-size="24" fill="#5E5852" font-weight="400" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Conta da data do atendimento até o fim do trimestre</text><rect x="60" y="150" width="680" height="330" rx="22" fill="#fff" stroke="#D9D2C6" stroke-width="2"/><path d="M140 290 H660" stroke="#D9D2C6" stroke-width="8" stroke-linecap="round"/><path d="M140 290 H660" stroke="#577328" stroke-width="8" stroke-linecap="round" stroke-dasharray="2 18"/><circle cx="140" cy="290" r="22" fill="#604034"/><circle cx="660" cy="290" r="22" fill="#577328"/><text x="140" y="236" font-size="22" fill="#5E5852" font-weight="400" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Consulta</text><text x="140" y="200" font-size="30" fill="#2B2B2B" font-weight="600" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif">6 out 2026</text><text x="660" y="236" font-size="22" fill="#5E5852" font-weight="400" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Último dia pra enviar</text><text x="660" y="200" font-size="30" fill="#2B2B2B" font-weight="600" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif">30 dez 2028</text><text x="400" y="350" font-size="26" fill="#2B2B2B" font-weight="600" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Dois anos, até o fim do mesmo trimestre civil</text><text x="400" y="392" font-size="22" fill="#5E5852" font-weight="400" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Exemplo da própria Assurance Maladie</text><text x="400" y="440" font-size="22" fill="#604034" font-weight="600" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Quanto antes você enviar, mais cedo o dinheiro volta</text></svg>
