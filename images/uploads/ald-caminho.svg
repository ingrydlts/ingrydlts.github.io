<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 840" role="img" aria-labelledby="t d"><title id="t">O caminho da ALD</title><desc id="d">Seis etapas: consulta com o médico, pedido com o protocole de soins, análise da CPAM, carta de notificação, uso da ordonnance bizone e renovação ou suivi post-ALD.</desc><rect width="800" height="840" fill="#F4F1EC"/><text x="400" y="62" font-size="40" fill="#2B2B2B" font-weight="600" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif">O caminho da ALD</text><text x="400" y="102" font-size="24" fill="#5E5852" font-weight="400" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Do pedido à renovação, em 6 etapas</text><path d="M110 170 V730" stroke="#D9D2C6" stroke-width="6" stroke-linecap="round"/><rect x="150" y="110" width="81" height="26" rx="13" fill="#604034"/><text x="190" y="129" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">ANTES</text><circle cx="110" cy="170" r="30" fill="#604034"/><text x="110" y="181" font-size="30" fill="#fff" font-weight="700" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif">1</text><text x="165" y="168" font-size="29" fill="#2B2B2B" font-weight="600" text-anchor="start" font-family="Fraunces, Georgia, 'Times New Roman', serif">Consulta com o seu médico</text><text x="165" y="202" font-size="22" fill="#5E5852" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Pode ser o médecin traitant</text><rect x="150" y="222" width="94" height="26" rx="13" fill="#604034"/><text x="197" y="241" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">PEDIDO</text><circle cx="110" cy="282" r="30" fill="#604034"/><text x="110" y="293" font-size="30" fill="#fff" font-weight="700" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif">2</text><text x="165" y="280" font-size="29" fill="#2B2B2B" font-weight="600" text-anchor="start" font-family="Fraunces, Georgia, 'Times New Roman', serif">O médico faz o pedido</text><text x="165" y="314" font-size="22" fill="#5E5852" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Preenche o protocole de soins</text><circle cx="110" cy="394" r="30" fill="#604034"/><text x="110" y="405" font-size="30" fill="#fff" font-weight="700" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif">3</text><text x="165" y="392" font-size="29" fill="#2B2B2B" font-weight="600" text-anchor="start" font-family="Fraunces, Georgia, 'Times New Roman', serif">A CPAM analisa</text><text x="165" y="426" font-size="22" fill="#5E5852" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">O serviço médico dá o acordo</text><rect x="150" y="446" width="120" height="26" rx="13" fill="#577328"/><text x="210" y="465" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">DIREITOS</text><circle cx="110" cy="506" r="30" fill="#577328"/><text x="110" y="517" font-size="30" fill="#fff" font-weight="700" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif">4</text><text x="165" y="504" font-size="29" fill="#2B2B2B" font-weight="600" text-anchor="start" font-family="Fraunces, Georgia, 'Times New Roman', serif">Chega a carta de notificação</text><text x="165" y="538" font-size="22" fill="#5E5852" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">E o espaço ALD no compte ameli</text><circle cx="110" cy="618" r="30" fill="#577328"/><text x="110" y="629" font-size="30" fill="#fff" font-weight="700" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif">5</text><text x="165" y="616" font-size="29" fill="#2B2B2B" font-weight="600" text-anchor="start" font-family="Fraunces, Georgia, 'Times New Roman', serif">Você usa a ordonnance bizone</text><text x="165" y="650" font-size="22" fill="#5E5852" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Soins da ALD de um lado, o resto do outro</text><rect x="150" y="670" width="94" height="26" rx="13" fill="#B8933F"/><text x="197" y="689" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">DEPOIS</text><circle cx="110" cy="730" r="30" fill="#B8933F"/><text x="110" y="741" font-size="30" fill="#fff" font-weight="700" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif">6</text><text x="165" y="728" font-size="29" fill="#2B2B2B" font-weight="600" text-anchor="start" font-family="Fraunces, Georgia, 'Times New Roman', serif">Renovar ou passar ao suivi post-ALD</text><text x="165" y="762" font-size="22" fill="#5E5852" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Quando o período termina</text></svg>
