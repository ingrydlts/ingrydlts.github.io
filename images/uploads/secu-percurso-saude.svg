<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 998" role="img" aria-labelledby="t d"><title id="t">O percurso da saúde na França</title><desc id="d">Sete etapas em sequência: endereço e documentos, pedido de afiliação, número provisório, número definitivo, compte ameli, Carte Vitale, médecin traitant e mutuelle.</desc><rect width="800" height="998" fill="#F4F1EC"/><text x="400" y="62" font-size="40" fill="#2B2B2B" font-weight="600" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif">O percurso da saúde na França</text><text x="400" y="102" font-size="24" fill="#5E5852" font-weight="400" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Do primeiro endereço até o cartão no bolso</text><path d="M110 170 V878" stroke="#D9D2C6" stroke-width="6" stroke-linecap="round"/><rect x="150" y="108" width="81" height="26" rx="13" fill="#604034"/><text x="190" y="127" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">ANTES</text><circle cx="110" cy="170" r="30" fill="#604034"/><text x="110" y="181" font-size="30" fill="#fff" font-weight="700" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif">1</text><text x="165" y="168" font-size="30" fill="#2B2B2B" font-weight="600" text-anchor="start" font-family="Fraunces, Georgia, 'Times New Roman', serif">Endereço e documentos</text><text x="165" y="202" font-size="22" fill="#5E5852" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Onde você mora e o que prova isso</text><rect x="150" y="226" width="94" height="26" rx="13" fill="#604034"/><text x="197" y="245" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">PEDIDO</text><circle cx="110" cy="288" r="30" fill="#604034"/><text x="110" y="299" font-size="30" fill="#fff" font-weight="700" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif">2</text><text x="165" y="286" font-size="30" fill="#2B2B2B" font-weight="600" text-anchor="start" font-family="Fraunces, Georgia, 'Times New Roman', serif">Pedido de afiliação</text><text x="165" y="320" font-size="22" fill="#5E5852" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">No portal certo para o seu perfil</text><circle cx="110" cy="406" r="30" fill="#604034"/><text x="110" y="417" font-size="30" fill="#fff" font-weight="700" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif">3</text><text x="165" y="404" font-size="30" fill="#2B2B2B" font-weight="600" text-anchor="start" font-family="Fraunces, Georgia, 'Times New Roman', serif">Número provisório</text><text x="165" y="438" font-size="22" fill="#5E5852" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Já dá direito, mas ainda não dá conta nem cartão</text><rect x="150" y="462" width="120" height="26" rx="13" fill="#577328"/><text x="210" y="481" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">DIREITOS</text><circle cx="110" cy="524" r="30" fill="#577328"/><text x="110" y="535" font-size="30" fill="#fff" font-weight="700" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif">4</text><text x="165" y="522" font-size="30" fill="#2B2B2B" font-weight="600" text-anchor="start" font-family="Fraunces, Georgia, 'Times New Roman', serif">Número definitivo</text><text x="165" y="556" font-size="22" fill="#5E5852" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">A identidade é certificada e a abertura de direitos fecha</text><circle cx="110" cy="642" r="30" fill="#577328"/><text x="110" y="653" font-size="30" fill="#fff" font-weight="700" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif">5</text><text x="165" y="640" font-size="30" fill="#2B2B2B" font-weight="600" text-anchor="start" font-family="Fraunces, Georgia, 'Times New Roman', serif">Compte ameli</text><text x="165" y="674" font-size="22" fill="#5E5852" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Reembolsos, atestados e o pedido do cartão</text><rect x="150" y="698" width="133" height="26" rx="13" fill="#B8933F"/><text x="216" y="717" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">DIA A DIA</text><circle cx="110" cy="760" r="30" fill="#B8933F"/><text x="110" y="771" font-size="30" fill="#fff" font-weight="700" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif">6</text><text x="165" y="758" font-size="30" fill="#2B2B2B" font-weight="600" text-anchor="start" font-family="Fraunces, Georgia, 'Times New Roman', serif">Carte Vitale</text><text x="165" y="792" font-size="22" fill="#5E5852" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">O cartão verde chega em 2 a 3 semanas</text><circle cx="110" cy="878" r="30" fill="#B8933F"/><text x="110" y="889" font-size="30" fill="#fff" font-weight="700" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif">7</text><text x="165" y="876" font-size="30" fill="#2B2B2B" font-weight="600" text-anchor="start" font-family="Fraunces, Georgia, 'Times New Roman', serif">Médecin traitant e mutuelle</text><text x="165" y="910" font-size="22" fill="#5E5852" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">O que faz o reembolso render mais</text><text x="400" y="972" font-size="21" fill="#604034" font-weight="600" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Em qualquer etapa, pedido no canal errado ou carta devolvida trava o dossiê</text></svg>
