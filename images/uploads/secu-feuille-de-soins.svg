<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 784" role="img" aria-labelledby="t d"><title id="t">Sem Carte Vitale: o caminho do reembolso</title><desc id="d">Quatro etapas em sequência: você paga a consulta, recebe a feuille de soins em papel, manda para a CPAM por app, correio ou balcão e tem até dois anos para pedir o reembolso.</desc><rect width="800" height="784" fill="#F4F1EC"/><text x="400" y="62" font-size="34" fill="#2B2B2B" font-weight="600" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif">Sem a Carte Vitale: o caminho do reembolso</text><rect x="60" y="140" width="680" height="128" rx="22" fill="#fff" stroke="#D9D2C6" stroke-width="2"/><circle cx="104" cy="204" r="24" fill="#604034"/><text x="104" y="214" font-size="28" fill="#fff" font-weight="700" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif">1</text><circle cx="650" cy="204" r="38" fill="#F4F1EC" stroke="#604034" stroke-width="3"/><text x="650" y="220" font-size="44" fill="#604034" font-weight="700" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif">€</text><text x="150" y="200" font-size="30" fill="#2B2B2B" font-weight="600" text-anchor="start" font-family="Fraunces, Georgia, 'Times New Roman', serif">Você paga</text><text x="150" y="238" font-size="23" fill="#5E5852" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">a consulta na hora</text><path d="M400 271 V289" stroke="#604034" stroke-width="4" stroke-linecap="round"/><path d="M388 277 L400 293 L412 277" fill="none" stroke="#604034" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="60" y="302" width="680" height="128" rx="22" fill="#fff" stroke="#D9D2C6" stroke-width="2"/><circle cx="104" cy="366" r="24" fill="#604034"/><text x="104" y="376" font-size="28" fill="#fff" font-weight="700" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif">2</text><path d="M620 326 H662 L682 346 V406 H620 Z" fill="#F4F1EC" stroke="#604034" stroke-width="3" stroke-linejoin="round"/><rect x="632" y="360" width="36" height="5" rx="2" fill="#604034" opacity=".6"/><rect x="632" y="376" width="28" height="5" rx="2" fill="#604034" opacity=".6"/><rect x="632" y="392" width="20" height="5" rx="2" fill="#604034" opacity=".6"/><text x="150" y="362" font-size="27" fill="#2B2B2B" font-weight="600" text-anchor="start" font-family="Fraunces, Georgia, 'Times New Roman', serif">Você recebe a feuille de soins</text><text x="150" y="400" font-size="23" fill="#5E5852" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">a folha de papel do médico</text><path d="M400 433 V451" stroke="#604034" stroke-width="4" stroke-linecap="round"/><path d="M388 439 L400 455 L412 439" fill="none" stroke="#604034" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="60" y="464" width="680" height="128" rx="22" fill="#fff" stroke="#D9D2C6" stroke-width="2"/><circle cx="104" cy="528" r="24" fill="#604034"/><text x="104" y="538" font-size="28" fill="#fff" font-weight="700" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif">3</text><rect x="610" y="500" width="80" height="56" rx="8" fill="#F4F1EC" stroke="#604034" stroke-width="3"/><path d="M610 508 L650 536 L690 508" fill="none" stroke="#604034" stroke-width="3" stroke-linejoin="round"/><text x="150" y="524" font-size="27" fill="#2B2B2B" font-weight="600" text-anchor="start" font-family="Fraunces, Georgia, 'Times New Roman', serif">Você manda pra sua CPAM</text><text x="150" y="562" font-size="23" fill="#5E5852" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">pelo app, por correio ou no balcão</text><path d="M400 595 V613" stroke="#604034" stroke-width="4" stroke-linecap="round"/><path d="M388 601 L400 617 L412 601" fill="none" stroke="#604034" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="60" y="626" width="680" height="128" rx="22" fill="#fff" stroke="#577328" stroke-width="4"/><circle cx="104" cy="690" r="24" fill="#577328"/><text x="104" y="700" font-size="28" fill="#fff" font-weight="700" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif">4</text><circle cx="650" cy="690" r="38" fill="#577328"/><path d="M634 690 L646 703 L668 678" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="150" y="686" font-size="30" fill="#2B2B2B" font-weight="600" text-anchor="start" font-family="Fraunces, Georgia, 'Times New Roman', serif">Reembolso</text><text x="150" y="724" font-size="23" fill="#5E5852" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">você tem até 2 anos pra enviar</text></svg>
