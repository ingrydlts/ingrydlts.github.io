<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 685" role="img" aria-labelledby="t d"><title id="t">O que a ALD muda no reembolso</title><desc id="d">Três cartões: 100 por cento dos cuidados ligados à doença, 15 por cento para remédios de benefício fraco, e o restante segue a regra normal.</desc><rect width="800" height="685" fill="#F4F1EC"/><text x="400" y="60" font-size="40" fill="#2B2B2B" font-weight="600" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif">O que a ALD muda no reembolso</text><text x="400" y="98" font-size="24" fill="#5E5852" font-weight="400" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Só vale para os cuidados ligados à doença</text><rect x="60" y="140" width="680" height="150" rx="22" fill="#fff" stroke="#D9D2C6" stroke-width="2"/><rect x="60" y="140" width="12" height="150" rx="6" fill="#577328"/><text x="110" y="224" font-size="48" fill="#577328" font-weight="600" text-anchor="start" font-family="Fraunces, Georgia, 'Times New Roman', serif">100%</text><text x="290" y="198" font-size="26" fill="#2B2B2B" font-weight="600" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">dos soins ligados à ALD</text><text x="290" y="236" font-size="21" fill="#5E5852" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Do valor reembolsável</text><text x="290" y="264" font-size="21" fill="#5E5852" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">pela Assurance Maladie</text><rect x="60" y="315" width="680" height="150" rx="22" fill="#fff" stroke="#D9D2C6" stroke-width="2"/><rect x="60" y="315" width="12" height="150" rx="6" fill="#B8933F"/><text x="110" y="399" font-size="48" fill="#B8933F" font-weight="600" text-anchor="start" font-family="Fraunces, Georgia, 'Times New Roman', serif">15%</text><text x="290" y="373" font-size="26" fill="#2B2B2B" font-weight="600" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">em remédios de benefício fraco</text><text x="290" y="411" font-size="21" fill="#5E5852" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Os médicaments à service médical rendu</text><text x="290" y="439" font-size="21" fill="#5E5852" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">faible são exceção</text><rect x="60" y="490" width="680" height="150" rx="22" fill="#fff" stroke="#D9D2C6" stroke-width="2"/><rect x="60" y="490" width="12" height="150" rx="6" fill="#604034"/><text x="110" y="574" font-size="40" fill="#604034" font-weight="600" text-anchor="start" font-family="Fraunces, Georgia, 'Times New Roman', serif">Resto</text><text x="290" y="548" font-size="26" fill="#2B2B2B" font-weight="600" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Certos custos ficam com você</text><text x="290" y="586" font-size="21" fill="#5E5852" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Consultas e remédios sem ligação com</text><text x="290" y="614" font-size="21" fill="#5E5852" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">a doença seguem a regra normal</text></svg>
