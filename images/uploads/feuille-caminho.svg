<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 810" role="img" aria-labelledby="t d"><title id="t">O caminho do reembolso sem Carte Vitale</title><desc id="d">Seis etapas: consulta e pagamento, feuille de soins, preencher e assinar, enviar à CPAM, a CPAM paga a parte da Sécu e a mutuelle reembolsa o resto.</desc><rect width="800" height="810" fill="#F4F1EC"/><text x="400" y="62" font-size="40" fill="#2B2B2B" font-weight="600" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif">O caminho do reembolso</text><text x="400" y="102" font-size="24" fill="#5E5852" font-weight="400" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Sem Carte Vitale, o papel leva o dinheiro de volta</text><path d="M110 170 V710" stroke="#D9D2C6" stroke-width="6" stroke-linecap="round"/><rect x="150" y="110" width="159" height="26" rx="13" fill="#604034"/><text x="229" y="129" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">CONSULTÓRIO</text><circle cx="110" cy="170" r="30" fill="#604034"/><text x="110" y="181" font-size="30" fill="#fff" font-weight="700" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif">1</text><text x="165" y="168" font-size="29" fill="#2B2B2B" font-weight="600" text-anchor="start" font-family="Fraunces, Georgia, 'Times New Roman', serif">Consulta e pagamento</text><text x="165" y="202" font-size="22" fill="#5E5852" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Você paga o atendimento na hora</text><circle cx="110" cy="278" r="30" fill="#604034"/><text x="110" y="289" font-size="30" fill="#fff" font-weight="700" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif">2</text><text x="165" y="276" font-size="29" fill="#2B2B2B" font-weight="600" text-anchor="start" font-family="Fraunces, Georgia, 'Times New Roman', serif">Feuille de soins</text><text x="165" y="310" font-size="22" fill="#5E5852" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">O profissional entrega a folha de papel</text><rect x="150" y="326" width="81" height="26" rx="13" fill="#604034"/><text x="190" y="345" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">PAPEL</text><circle cx="110" cy="386" r="30" fill="#604034"/><text x="110" y="397" font-size="30" fill="#fff" font-weight="700" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif">3</text><text x="165" y="384" font-size="29" fill="#2B2B2B" font-weight="600" text-anchor="start" font-family="Fraunces, Georgia, 'Times New Roman', serif">Preencher e assinar</text><text x="165" y="418" font-size="22" fill="#5E5852" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Seus dados, número de sécu e assinatura</text><rect x="150" y="434" width="81" height="26" rx="13" fill="#B8933F"/><text x="190" y="453" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">ENVIO</text><circle cx="110" cy="494" r="30" fill="#B8933F"/><text x="110" y="505" font-size="30" fill="#fff" font-weight="700" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif">4</text><text x="165" y="492" font-size="29" fill="#2B2B2B" font-weight="600" text-anchor="start" font-family="Fraunces, Georgia, 'Times New Roman', serif">Enviar à CPAM</text><text x="165" y="526" font-size="22" fill="#5E5852" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Pelo app, por correio ou no balcão</text><rect x="150" y="542" width="133" height="26" rx="13" fill="#577328"/><text x="216" y="561" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">REEMBOLSO</text><circle cx="110" cy="602" r="30" fill="#577328"/><text x="110" y="613" font-size="30" fill="#fff" font-weight="700" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif">5</text><text x="165" y="600" font-size="29" fill="#2B2B2B" font-weight="600" text-anchor="start" font-family="Fraunces, Georgia, 'Times New Roman', serif">A CPAM paga</text><text x="165" y="634" font-size="22" fill="#5E5852" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">A parte da Sécu cai na conta do seu RIB</text><circle cx="110" cy="710" r="30" fill="#577328"/><text x="110" y="721" font-size="30" fill="#fff" font-weight="700" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif">6</text><text x="165" y="708" font-size="29" fill="#2B2B2B" font-weight="600" text-anchor="start" font-family="Fraunces, Georgia, 'Times New Roman', serif">Mutuelle</text><text x="165" y="742" font-size="22" fill="#5E5852" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Com o comprovante, ela reembolsa o resto</text></svg>
